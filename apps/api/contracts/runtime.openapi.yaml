    post:
      operationId: decideTeamInviteRequest
      summary: Mark a pending invitation request handled or declined
      description: Current adult Manager context only. Pending requests are transitioned once; already decided or
        different-scope requests are unavailable. Stable mutation headers are required. This records a staff decision;
        it does not automatically create an invitation or grant membership.
      parameters:
      - $ref: '#/components/parameters/ContractVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequestDecision'
      responses:
        '200':
          description: Current authorized, private no-store response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteRequestDecision'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
  /teams/{teamId}/spectator-connections:
    parameters:
    - $ref: '#/components/parameters/TeamId'
    - $ref: '#/components/parameters/SeasonId'
    - name: X-Longball-Role
      in: header
      required: true
      schema:
        enum:
        - spectator
    get:
      operationId: readSpectatorConnections
      summary: Read the current team player-name connection choices
      description: A current spectator membership and live grant are required. Only current active team player IDs/display
        names and this account's selected connection are returned; no FA IDs, profiles, availability or statistics.
      responses:
        '200':
          description: Current authorized, private no-store response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpectatorConnections'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: selectSpectatorConnection
      summary: Choose or clear this spectator account's team player connection
      description: Requires current spectator access, event-contract headers and a stable key. The selected player
        must belong to the current team-season; null clears the connection. A connection is a viewing preference and
        grants no additional data or team authority.
      parameters:
      - $ref: '#/components/parameters/ContractVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpectatorConnectionInput'
      responses:
        '200':
          description: Current authorized, private no-store response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpectatorConnections'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT or opaque session}
  schemas:
    LoginAnalyticsIdentifier:
      type: string
      minLength: 1
      maxLength: 150
      pattern: '^[A-Za-z0-9_-]{1,150}(?![\s\S])'
    LoginAnalyticsTimestamp:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: UTC epoch milliseconds, rendered in Europe/London by the client.
    LoginAnalyticsCount:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    LoginAnalyticsRole:
      type: string
      enum: [super_admin, club_admin, manager, player, spectator]
    LoginAnalyticsEventType:
      type: string
      enum: [login_success, login_failure, logout]
    LoginAnalyticsProvider:
      type: string
      enum: [demo, spectator_pin, oidc]
    LoginAnalyticsCursor:
      type: string
      maxLength: 220
      pattern: '^2\.[0-9]{1,16}\.[0-9]{1,16}\.[0-9]{1,16}\.[A-Za-z0-9_-]{1,150}\.[a-f0-9]{16}(?![\s\S])'
      description: Versioned opaque event boundary binds observation time, persisted event-ordinal high-water mark and normalized filters, expires after one hour, and is not an authentication capability. The parser checks safe integers, filter binding and expiry; public event rows omit the internal ordinal.
    LoginAnalyticsFilters:
      type: object
      additionalProperties: false
      required: [range]
      properties:
        range: {type: string, enum: [24h, 7d, 30d]}
        clubId: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
        teamId: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
        role: {$ref: '#/components/schemas/LoginAnalyticsRole'}
        event: {$ref: '#/components/schemas/LoginAnalyticsEventType'}
        cursor: {$ref: '#/components/schemas/LoginAnalyticsCursor'}
    LoginAnalyticsScope:
      type: object
      additionalProperties: false
      required: [clubId, clubName, teamId, teamName, seasonId, role]
      properties:
        clubId: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
        clubName: {type: string, minLength: 1, maxLength: 200}
        teamId: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
        teamName: {type: string, minLength: 1, maxLength: 200}
        seasonId: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
        role: {$ref: '#/components/schemas/LoginAnalyticsRole'}
    LoginAnalyticsEvent:
      type: object
      additionalProperties: false
      required: [id, at, type, provider, accountId, actorLabel, role, scopes, reason, count]
      properties:
        id: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
        at: {$ref: '#/components/schemas/LoginAnalyticsTimestamp'}
        type: {$ref: '#/components/schemas/LoginAnalyticsEventType'}
        provider: {$ref: '#/components/schemas/LoginAnalyticsProvider'}
        accountId:
          anyOf: [{$ref: '#/components/schemas/LoginAnalyticsIdentifier'}, {type: 'null'}]
        actorLabel: {type: [string, 'null'], minLength: 1, maxLength: 200}
        role:
          anyOf: [{$ref: '#/components/schemas/LoginAnalyticsRole'}, {type: 'null'}]
        scopes:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/LoginAnalyticsScope'}
        reason: {type: [string, 'null'], maxLength: 256}
        count: {$ref: '#/components/schemas/LoginAnalyticsCount'}
    LoginAnalyticsSummary:
      type: object
      additionalProperties: false
      required: [signIns, failedAttempts, uniqueAccounts, activeAccounts, activeSessions, enabledAccounts, lastSignInAt]
      properties:
        signIns: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        failedAttempts: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        uniqueAccounts: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        activeAccounts: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        activeSessions:
          anyOf: [{$ref: '#/components/schemas/LoginAnalyticsCount'}, {type: 'null'}]
          description: Null when provider session validity cannot be established; not a claim about external OIDC sessions.
        enabledAccounts: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        lastSignInAt:
          anyOf: [{$ref: '#/components/schemas/LoginAnalyticsTimestamp'}, {type: 'null'}]
    LoginAnalyticsDirectory:
      type: object
      additionalProperties: false
      required: [clubs, teams]
      properties:
        clubs:
          type: array
          maxItems: 20000
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
              name: {type: string, minLength: 1, maxLength: 200}
        teams:
          type: array
          maxItems: 20000
          items:
            type: object
            additionalProperties: false
            required: [id, clubId, name, ageGroup]
            properties:
              id: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
              clubId: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
              name: {type: string, minLength: 1, maxLength: 200}
              ageGroup: {type: string, minLength: 1, maxLength: 12, pattern: '^[^\u0000-\u001f\u007f]*\S[^\u0000-\u001f\u007f]*(?![\s\S])'}
    LoginAnalyticsTrendBucket:
      type: object
      additionalProperties: false
      required: [from, to, signIns, failedAttempts, uniqueAccounts]
      properties:
        from: {$ref: '#/components/schemas/LoginAnalyticsTimestamp'}
        to: {$ref: '#/components/schemas/LoginAnalyticsTimestamp'}
        signIns: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        failedAttempts: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        uniqueAccounts: {$ref: '#/components/schemas/LoginAnalyticsCount'}
    LoginAnalyticsRoleRow:
      type: object
      additionalProperties: false
      required: [role, label, signIns, uniqueAccounts, activeAccounts]
      properties:
        role: {$ref: '#/components/schemas/LoginAnalyticsRole'}
        label: {type: string, minLength: 1, maxLength: 200}
        signIns: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        uniqueAccounts: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        activeAccounts: {$ref: '#/components/schemas/LoginAnalyticsCount'}
    LoginAnalyticsClubRow:
      type: object
      additionalProperties: false
      required: [clubId, clubName, teamCount, signIns, uniqueAccounts, activeAccounts, lastSeenAt]
      properties:
        clubId: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
        clubName: {type: string, minLength: 1, maxLength: 200}
        teamCount: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        signIns: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        uniqueAccounts: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        activeAccounts: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        lastSeenAt:
          anyOf: [{$ref: '#/components/schemas/LoginAnalyticsTimestamp'}, {type: 'null'}]
    LoginAnalyticsTeamRow:
      type: object
      additionalProperties: false
      required: [teamId, teamName, clubId, clubName, ageGroup, signIns, uniqueAccounts, activeAccounts, lastSeenAt]
      properties:
        teamId: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
        teamName: {type: string, minLength: 1, maxLength: 200}
        clubId: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
        clubName: {type: string, minLength: 1, maxLength: 200}
        ageGroup: {type: string, minLength: 1, maxLength: 12, pattern: '^[^\u0000-\u001f\u007f]*\S[^\u0000-\u001f\u007f]*(?![\s\S])'}
        signIns: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        uniqueAccounts: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        activeAccounts: {$ref: '#/components/schemas/LoginAnalyticsCount'}
        lastSeenAt:
          anyOf: [{$ref: '#/components/schemas/LoginAnalyticsTimestamp'}, {type: 'null'}]
    LoginAnalyticsActiveUser:
      type: object
      additionalProperties: false
      required: [accountId, label, role, lastSeenAt, sessionCount, scopes]
      properties:
        accountId: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
        label: {type: string, minLength: 1, maxLength: 200}
        role: {$ref: '#/components/schemas/LoginAnalyticsRole'}
        lastSeenAt: {$ref: '#/components/schemas/LoginAnalyticsTimestamp'}
        sessionCount:
          anyOf: [{$ref: '#/components/schemas/LoginAnalyticsCount'}, {type: 'null'}]
        scopes:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/LoginAnalyticsScope'}
    LoginAnalyticsPage:
      type: object
      additionalProperties: false
      required: [nextCursor, limit]
      properties:
        nextCursor:
          anyOf: [{$ref: '#/components/schemas/LoginAnalyticsCursor'}, {type: 'null'}]
        limit: {type: integer, const: 50}
    LoginAnalyticsCoverage:
      type: object
      additionalProperties: false
      required: [startedAt, eventRowsTruncated, activityRowsTruncated, scopeRowsTruncated, eventLimit, activityWindowMinutes, pollingIncluded, upstreamProviderFailuresIncluded, collectionHealthy]
      properties:
        startedAt:
          anyOf: [{$ref: '#/components/schemas/LoginAnalyticsTimestamp'}, {type: 'null'}]
        eventRowsTruncated: {type: boolean}
        activityRowsTruncated: {type: boolean}
        scopeRowsTruncated: {type: boolean}
        eventLimit: {type: integer, const: 20000}
        activityWindowMinutes: {type: integer, const: 15}
        pollingIncluded: {type: boolean, const: true}
        upstreamProviderFailuresIncluded: {type: boolean, const: false}
        collectionHealthy: {type: boolean}
    LoginAnalyticsDto:
      type: object
      additionalProperties: false
      required: [kind, observedAt, eventAsOf, from, filters, summary, directory, trend, roles, clubs, teams, activeUsers, events, page, coverage, definitions]
      properties:
        kind: {type: string, const: login-analytics}
        observedAt: {$ref: '#/components/schemas/LoginAnalyticsTimestamp'}
        eventAsOf: {$ref: '#/components/schemas/LoginAnalyticsTimestamp'}
        from: {$ref: '#/components/schemas/LoginAnalyticsTimestamp'}
        filters: {$ref: '#/components/schemas/LoginAnalyticsFilters'}
        summary: {$ref: '#/components/schemas/LoginAnalyticsSummary'}
        directory: {$ref: '#/components/schemas/LoginAnalyticsDirectory'}
        trend:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/LoginAnalyticsTrendBucket'}
        roles:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/LoginAnalyticsRoleRow'}
        clubs:
          type: array
          maxItems: 20000
          items: {$ref: '#/components/schemas/LoginAnalyticsClubRow'}
        teams:
          type: array
          maxItems: 20000
          items: {$ref: '#/components/schemas/LoginAnalyticsTeamRow'}
        activeUsers:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/LoginAnalyticsActiveUser'}
        events:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/LoginAnalyticsEvent'}
        page: {$ref: '#/components/schemas/LoginAnalyticsPage'}
        coverage: {$ref: '#/components/schemas/LoginAnalyticsCoverage'}
        definitions:
          type: array
          items: {type: string, maxLength: 1000}
    SignInRules:
      type: object
      additionalProperties: false
      required: [username, password, spectatorPin]
      description: >-
        Creation/change rules shared by all account types. The server reserves managed
        usernames case-insensitively across teams and credential routes. Team-based initial
        suggestions use the team name, first name and surname initial, for example
        Roma.SebL, with a suffix for known duplicate claims. Existing usernames and
        credentials are grandfathered, including configured demo logins.
      properties:
        username: {$ref: '#/components/schemas/UsernameSignInRules'}
        password: {$ref: '#/components/schemas/PasswordSignInRules'}
        spectatorPin: {$ref: '#/components/schemas/SpectatorPinSignInRules'}
    UsernameSignInRules:
      type: object
      additionalProperties: false
      required: [minLength, maxLength, allowNumbers, allowSeparators]
      description: >-
        Newly chosen usernames use ASCII letters and optionally numbers and dot,
        underscore or dash separators. They start with a letter or number. Length
        limits are inclusive; maxLength must be at least minLength and at least eight.
        Username matching and duplicate reservation are case-insensitive. These limits
        do not invalidate established login names.
      properties:
        minLength: {type: integer, minimum: 3, maximum: 32, default: 3}
        maxLength: {type: integer, minimum: 8, maximum: 40, default: 40}
        allowNumbers: {type: boolean, default: true}
        allowSeparators: {type: boolean, default: true}
      allOf:
      - {if: {properties: {minLength: {minimum: 9}}}, then: {properties: {maxLength: {minimum: 9}}}}
      - {if: {properties: {minLength: {minimum: 10}}}, then: {properties: {maxLength: {minimum: 10}}}}
      - {if: {properties: {minLength: {minimum: 11}}}, then: {properties: {maxLength: {minimum: 11}}}}
      - {if: {properties: {minLength: {minimum: 12}}}, then: {properties: {maxLength: {minimum: 12}}}}
      - {if: {properties: {minLength: {minimum: 13}}}, then: {properties: {maxLength: {minimum: 13}}}}
      - {if: {properties: {minLength: {minimum: 14}}}, then: {properties: {maxLength: {minimum: 14}}}}
      - {if: {properties: {minLength: {minimum: 15}}}, then: {properties: {maxLength: {minimum: 15}}}}
      - {if: {properties: {minLength: {minimum: 16}}}, then: {properties: {maxLength: {minimum: 16}}}}
      - {if: {properties: {minLength: {minimum: 17}}}, then: {properties: {maxLength: {minimum: 17}}}}
      - {if: {properties: {minLength: {minimum: 18}}}, then: {properties: {maxLength: {minimum: 18}}}}
      - {if: {properties: {minLength: {minimum: 19}}}, then: {properties: {maxLength: {minimum: 19}}}}
      - {if: {properties: {minLength: {minimum: 20}}}, then: {properties: {maxLength: {minimum: 20}}}}
      - {if: {properties: {minLength: {minimum: 21}}}, then: {properties: {maxLength: {minimum: 21}}}}
      - {if: {properties: {minLength: {minimum: 22}}}, then: {properties: {maxLength: {minimum: 22}}}}
      - {if: {properties: {minLength: {minimum: 23}}}, then: {properties: {maxLength: {minimum: 23}}}}
      - {if: {properties: {minLength: {minimum: 24}}}, then: {properties: {maxLength: {minimum: 24}}}}
      - {if: {properties: {minLength: {minimum: 25}}}, then: {properties: {maxLength: {minimum: 25}}}}
      - {if: {properties: {minLength: {minimum: 26}}}, then: {properties: {maxLength: {minimum: 26}}}}
      - {if: {properties: {minLength: {minimum: 27}}}, then: {properties: {maxLength: {minimum: 27}}}}
      - {if: {properties: {minLength: {minimum: 28}}}, then: {properties: {maxLength: {minimum: 28}}}}
      - {if: {properties: {minLength: {minimum: 29}}}, then: {properties: {maxLength: {minimum: 29}}}}
      - {if: {properties: {minLength: {minimum: 30}}}, then: {properties: {maxLength: {minimum: 30}}}}
      - {if: {properties: {minLength: {minimum: 31}}}, then: {properties: {maxLength: {minimum: 31}}}}
      - {if: {properties: {minLength: {minimum: 32}}}, then: {properties: {maxLength: {minimum: 32}}}}
    PasswordSignInRules:
      type: object
      additionalProperties: false
      required: [minLength, requireUppercase, requireLowercase, requireNumber, requireSymbol, disallowUsername]
      description: >-
        Rules for newly chosen provider passwords across Player and staff accounts.
        Password entry remains with the configured provider; this endpoint neither
        receives passwords nor resets existing credentials. Passwords have an absolute
        upper limit of 128 characters. Provider confirmation is reported separately.
      properties:
        minLength: {type: integer, minimum: 8, maximum: 64, default: 12}
        requireUppercase: {type: boolean, default: true}
        requireLowercase: {type: boolean, default: true}
        requireNumber: {type: boolean, default: true}
        requireSymbol: {type: boolean, default: true}
        disallowUsername:
          type: boolean
          default: true
          description: A newly chosen password must not contain the username, compared case-insensitively.
    SpectatorPinSignInRules:
      type: object
      additionalProperties: false
      required: [blockSimpleCodes]
      description: >-
        Spectator-only passcodes remain exactly four decimal digits. This setting
        governs newly chosen PINs; it does not grant Player or staff authority or
        revalidate existing spectator logins. Bounded attempts and durable lockout
        remain separate and cannot be disabled by this setting.
      properties:
        blockSimpleCodes:
          type: boolean
          default: true
          description: Refuse repeated digits, ascending/descending sequences, repeated pairs and the maintained easily-guessed code list.
    SignInRulesDto:
      type: object
      additionalProperties: false
      required: [kind, revision, rules, provider]
      properties:
        kind: {const: sign-in-rules}
        revision: {type: integer, minimum: 0, maximum: 9007199254740991}
        rules: {$ref: '#/components/schemas/SignInRules'}
        provider:
          type: object
          additionalProperties: false
          required: [status, detail]
          properties:
            status:
              enum: [applied, not_configured, pending]
              description: >-
                applied means the configured provider confirmed this persisted revision;
                not_configured means no password provider is connected and only local
                creation rules can be enforced; pending means the configured provider
                has not confirmed the current persisted revision. Existing logins remain
                valid in every state. A provider confirmation is required before a new
                provider identity or credential-setup flow may proceed.
            detail: {type: string, maxLength: 500, description: Non-personal explanation of the current enforcement state}
    SignInRulesInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, rules]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: The exact revision reviewed by the Super Admin; zero is the initial application rule revision.
        rules: {$ref: '#/components/schemas/SignInRules'}
    AdministrationScope:
      type: object
      additionalProperties: false
      required:
      - level
      - clubIds
      properties:
        level:
          enum:
          - super
          - club
        clubIds:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
          uniqueItems: true
    RuntimePrincipal:
      type: object
      additionalProperties: false
      required:
      - accountId
      - issuer
      - subject
      - identityClassification
      - adultVerified
      - strongAuth
      - authenticatedAt
      - status
      properties:
        accountId:
          $ref: '#/components/schemas/Identifier'
        issuer:
          type: string
          minLength: 1
        subject:
          type: string
          minLength: 1
        identityClassification:
          enum:
          - child_shared
          - adult_individual
          - unclassified
        adultVerified:
          type: boolean
        strongAuth:
          type: boolean
        authenticatedAt:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        status:
          enum:
          - active
          - disabled
        administration:
          $ref: '#/components/schemas/AdministrationScope'
    ClubDirectoryClub:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
          maxLength: 100
    ClubDirectoryTeam:
      type: object
      additionalProperties: false
      required:
      - id
      - clubId
      - name
      - ageGroup
      - seasonId
      - seasonLabel
      - leagueName
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        clubId:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
          maxLength: 100
        ageGroup:
          type: string
        seasonId:
          $ref: '#/components/schemas/Identifier'
        seasonLabel:
          type: string
        leagueName:
          type: string
          maxLength: 120
    ClubAdministration:
      type: object
      additionalProperties: false
      required:
      - kind
      - administration
      - clubs
      - teams
      - administrators
      - candidates
      properties:
        kind:
          const: club-administration
        administration:
          $ref: '#/components/schemas/AdministrationScope'
        clubs:
          type: array
          items:
            $ref: '#/components/schemas/ClubDirectoryClub'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/ClubDirectoryTeam'
        administrators:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - accountId
            - level
            - clubId
            properties:
              accountId:
                $ref: '#/components/schemas/Identifier'
              level:
                enum:
                - super
                - club
              clubId:
                oneOf:
                - $ref: '#/components/schemas/Identifier'
                - type: 'null'
        candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - accountId
            - label
            properties:
              accountId:
                $ref: '#/components/schemas/Identifier'
              label:
                type: string
    ClubAdministrationCommand:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - name
        properties:
          type:
            const: club.create
          name:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[^\u0000-\u001f\u007f]*\S[^\u0000-\u001f\u007f]*$
      - type: object
        additionalProperties: false
        required:
        - type
        - clubId
        - name
        - ageGroup
        - format
        - seasonStartYear
        properties:
          type:
            const: team.create
          clubId:
            $ref: '#/components/schemas/Identifier'
          name:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[^\u0000-\u001f\u007f]*\S[^\u0000-\u001f\u007f]*$
          ageGroup:
            type: string
            pattern: ^U(?:[5-9]|1[0-9]|2[01])$
          format:
            type: integer
            minimum: 5
            maximum: 11
          seasonStartYear:
            type: integer
            minimum: 2000
            maximum: 2100
      - type: object
        additionalProperties: false
        required:
        - type
        - accountId
        - level
        - clubId
        properties:
          type:
            enum:
            - administrator.grant
            - administrator.revoke
          accountId:
            $ref: '#/components/schemas/Identifier'
          level:
            enum:
            - super
            - club
          clubId:
            oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        allOf:
        - if:
            properties:
              level:
                const: super
          then:
            properties:
              clubId:
                type: 'null'
          else:
            properties:
              clubId:
                $ref: '#/components/schemas/Identifier'
    ClubAdministrationInput:
      type: object
      additionalProperties: false
      required:
      - command
      properties:
        command:
          $ref: '#/components/schemas/ClubAdministrationCommand'
    ClubReportRow:
      type: object
      additionalProperties: false
      required:
      - id
      - clubId
      - name
      - ageGroup
      - seasonId
      - seasonLabel
      - leagueName
      - players
      - completedGames
      - scoredGames
      - wins
      - draws
      - losses
