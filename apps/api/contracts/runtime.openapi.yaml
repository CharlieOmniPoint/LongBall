        '409': {$ref: '#/components/responses/Conflict'}
  /teams/{teamId}/player-stats:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
      - {$ref: '#/components/parameters/SeasonId'}
      - {name: X-Longball-Role, in: header, required: true, schema: {enum: [manager, administrator, player]}}
    get:
      operationId: readScopedPlayerStatistics
      summary: Read staff aggregates or only the currently linked player's aggregates
      description: Spectators are denied. Administrators use a narrow database projection; existing private records, preparation and feedback access is not widened. Accepted checkpoints override older archived revisions once per game. Unknown or reviewed detail stays explicit; no scheduled duration becomes actual participation. No attendance, RSVP, injury, preferences or private feedback is returned.
      responses:
        '200': {description: Exact own-player or team aggregate projection, content: {application/json: {schema: {$ref: '#/components/schemas/PlayerStatistics'}}}}
        '404': {$ref: '#/components/responses/Unavailable'}
  /teams/{teamId}/match-feedback:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
      - {$ref: '#/components/parameters/SeasonId'}
      - {name: X-Longball-Role, in: header, required: true, schema: {enum: [manager, player]}}
    get:
      operationId: readPrivatePostGameFeedback
      summary: Read own private feedback or assigned-manager feedback
      description: Other players never receive another child's notes. Administrators and spectators are denied. Private feedback uses separate storage and is absent from team statistics, community and report exports.
      responses:
        '200': {description: Current private feedback and authoritative edit-window status, content: {application/json: {schema: {$ref: '#/components/schemas/PrivateMatchFeedback'}}}}
        '404': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: saveOwnPrivatePostGameFeedback
      summary: Save the current linked player's rating and optional note
      description: Requires positive accepted participation and a verified original completion. Editing closes exclusively at midnight Europe/London on that completion day, including DST. Receipt replay does not submit a new edit or extend the original window. The durable command ID must equal Idempotency-Key; submitted player/account IDs are rejected.
      parameters:
        - {name: X-Longball-Role, in: header, required: true, schema: {const: player}}
        - {$ref: '#/components/parameters/ContractVersion'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [command], properties: {command: {$ref: '#/components/schemas/PrivateMatchFeedbackCommand'}}}}}
      responses:
        '200': {description: Durable actor-bound feedback receipt, content: {application/json: {schema: {$ref: '#/components/schemas/PrivateMatchFeedbackReceipt'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Conflict'}
  /teams/{teamId}/team-overview:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
      - {$ref: '#/components/parameters/SeasonId'}
      - {name: X-Longball-Role, in: header, required: true, schema: {enum: [manager, administrator, player, spectator]}}
    get:
      operationId: readCurrentPublicTeamOverview
      summary: Read current team and safe fixture metadata for all assigned roles
      description: Spectator access requires a current live grant. Includes saved unprepared fixtures; accepted match status overrides scheduled metadata without overriding explicit cancellation/postponement. Deleted tombstones are excluded. No roster, score, attendance, replies, feedback or raw preparation documents are returned.
      responses:
        '200': {description: Current safe team metadata, content: {application/json: {schema: {$ref: '#/components/schemas/TeamOverview'}}}}
        '404': {$ref: '#/components/responses/Unavailable'}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    ScheduledGameCommand:
      type: object
      additionalProperties: false
      required: [id, expectedRevision, fixtureId, type, reason, confirm]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        expectedRevision: {type: integer, minimum: 0}
        fixtureId: {$ref: '#/components/schemas/Identifier'}
        type: {enum: [fixture.cancelled, fixture.deleted]}
        reason: {type: string, minLength: 5, maxLength: 500}
        confirm: {const: true}
    ScheduledGameMetadata:
      type: object
      additionalProperties: false
      required: [id, seasonId, opponent, playedDate, kickoff, arrival, venue, homeAway, format, plannedHalfDurationMs, status, canCancel, canDelete, blockedReason]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        opponent: {type: string}
        playedDate: {type: string, format: date}
        kickoff: {type: [string, 'null']}
        arrival: {type: [string, 'null']}
        venue: {type: string}
        homeAway: {enum: [home, away]}
        format: {type: integer, minimum: 5, maximum: 11}
        plannedHalfDurationMs: {type: integer, minimum: 1}
        status: {enum: [scheduled, postponed, cancelled]}
        canCancel: {type: boolean}
        canDelete: {type: boolean}
        blockedReason: {enum: [recording_exists, null]}
    ScheduledGameManagement:
      type: object
      additionalProperties: false
      required: [kind, teamId, seasonId, revision, teamName, fixtures]
      properties:
        kind: {const: scheduled-game-management}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        revision: {type: integer, minimum: 0}
        teamName: {type: string}
        fixtures: {type: array, items: {$ref: '#/components/schemas/ScheduledGameMetadata'}}
    TeamOverview:
      type: object
      additionalProperties: false
      required: [kind, teamId, seasonId, team, games]
      properties:
        kind: {const: team-overview}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        team:
          type: object
          additionalProperties: false
          required: [name, ageGroup, clubName, seasonLabel]
          properties: {name: {type: string}, ageGroup: {type: string}, clubName: {type: string}, seasonLabel: {type: string}}
        games:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, opponent, playedDate, kickoff, venue, status, active]
            properties:
              id: {$ref: '#/components/schemas/Identifier'}
              opponent: {type: string}
              playedDate: {type: string, description: 'ISO calendar date; empty string explicitly represents an unknown date'}
              kickoff: {type: [string, 'null']}
              venue: {type: [string, 'null']}
              status: {enum: [scheduled, preparation, postponed, cancelled, first_half_running, first_half_paused, half_time, second_half_running, second_half_paused, completed, abandoned]}
              active: {type: boolean}
    StatisticPosition:
      type: object
      additionalProperties: false
      required: [code, label, playingMs, percentage]
      properties:
        code: {type: string}
        label: {type: string}
        playingMs: {type: integer, minimum: 0}
        percentage: {type: [number, 'null'], minimum: 0, maximum: 100}
    PlayerStatisticRow:
      type: object
      additionalProperties: false
      required: [playerId, label, knownPlayingMs, knownAppearances, knownGoals, knownOwnGoals, positions, unknownPositionMs, coverage]
      properties:
        playerId: {$ref: '#/components/schemas/Identifier'}
        label: {type: string}
        knownPlayingMs: {type: integer, minimum: 0}
        knownAppearances: {type: integer, minimum: 0}
        knownGoals: {type: integer, minimum: 0}
        knownOwnGoals: {type: integer, minimum: 0}
        positions: {type: array, items: {$ref: '#/components/schemas/StatisticPosition'}}
        unknownPositionMs: {type: integer, minimum: 0}
        coverage:
          type: object
          additionalProperties: false
          required: [recordedMatches, playingTimeKnownMatches, playingTimeUnknownMatches, reviewRequiredMatches, scoringCompleteMatches, scoringPartialMatches, scoringUnknownMatches]
          properties:
            recordedMatches: {type: integer, minimum: 0}
            playingTimeKnownMatches: {type: integer, minimum: 0}
            playingTimeUnknownMatches: {type: integer, minimum: 0}
            reviewRequiredMatches: {type: integer, minimum: 0}
            scoringCompleteMatches: {type: integer, minimum: 0}
            scoringPartialMatches: {type: integer, minimum: 0}
            scoringUnknownMatches: {type: integer, minimum: 0}
    StatisticScope:
      type: object
      additionalProperties: false
      required: [clubId, teamId, seasonId, seasonLabel, projectionVersion, asOf]
      properties:
        clubId: {$ref: '#/components/schemas/Identifier'}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        seasonLabel: {type: string}
        projectionVersion: {type: integer, minimum: 0}
        asOf: {type: [string, 'null'], format: date-time}
    PlayerStatistics:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, scope, player]
          properties:
            kind: {const: own-player-stats}
            scope: {$ref: '#/components/schemas/StatisticScope'}
            player: {$ref: '#/components/schemas/PlayerStatisticRow'}
        - type: object
          additionalProperties: false
          required: [kind, scope, players, team, formation]
          properties:
            kind: {const: team-player-stats}
            scope: {$ref: '#/components/schemas/StatisticScope'}
            players: {type: array, items: {$ref: '#/components/schemas/PlayerStatisticRow'}}
            team:
              type: object
              additionalProperties: false
              required: [knownPlayingMs, positions, unknownPositionMs]
              properties:
                knownPlayingMs: {type: integer, minimum: 0}
                positions: {type: array, items: {$ref: '#/components/schemas/StatisticPosition'}}
                unknownPositionMs: {type: integer, minimum: 0}
            formation:
              type: [object, 'null']
              additionalProperties: false
              required: [id, label, slots]
              properties:
                id: {type: string}
                label: {type: string}
                slots:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, positionCode, label, x, y]
                    properties: {id: {type: string}, positionCode: {type: string}, label: {type: string}, x: {type: number, minimum: 0, maximum: 1}, y: {type: number, minimum: 0, maximum: 1}}
    PrivateMatchFeedbackCommand:
      type: object
      additionalProperties: false
      required: [id, type, matchId, expectedRevision, rating, text]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        type: {const: feedback.saved}
        matchId: {$ref: '#/components/schemas/Identifier'}
        expectedRevision: {type: integer, minimum: 0}
        rating: {type: integer, minimum: 1, maximum: 5}
        text: {type: [string, 'null'], maxLength: 256}
    PrivateMatchFeedbackReceipt:
      type: object
      additionalProperties: false
      required: [kind, commandId, teamId, seasonId, matchId, revision]
      properties:
        kind: {const: match-feedback-receipt}
        commandId: {$ref: '#/components/schemas/Identifier'}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        matchId: {$ref: '#/components/schemas/Identifier'}
        revision: {type: integer, minimum: 1}
    PrivateMatchFeedbackEntry:
      type: object
      additionalProperties: false
      required: [playerId, playerLabel, rating, text, revision, createdAtMs, updatedAtMs]
      properties:
        playerId: {$ref: '#/components/schemas/Identifier'}
        playerLabel: {type: string}
        rating: {type: integer, minimum: 1, maximum: 5}
        text: {type: [string, 'null'], maxLength: 256}
        revision: {type: integer, minimum: 1}
        createdAtMs: {type: integer, minimum: 0}
        updatedAtMs: {type: integer, minimum: 0}
    PrivateMatchFeedback:
      type: object
      additionalProperties: false
      required: [kind, accountId, playerId, teamId, seasonId, audience, serverNowMs, matches]
      properties:
        kind: {const: match-feedback}
        accountId: {$ref: '#/components/schemas/Identifier'}
        playerId: {type: [string, 'null']}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        audience: {enum: [manager, player]}
        serverNowMs: {type: integer, minimum: 0}
        matches:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [matchId, label, playedDate, completedAtMs, closesAtMs, status, eligible, canEdit, own]
            properties:
              matchId: {$ref: '#/components/schemas/Identifier'}
              label: {type: string}
              playedDate: {type: [string, 'null'], format: date}
              completedAtMs: {type: [integer, 'null'], minimum: 0}
              closesAtMs: {type: [integer, 'null'], minimum: 0}
              status: {enum: [open, closed, review_required]}
              eligible: {type: boolean}
              canEdit: {type: boolean}
              own: {oneOf: [{$ref: '#/components/schemas/PrivateMatchFeedbackEntry'}, {type: 'null'}]}
              entries: {type: array, items: {$ref: '#/components/schemas/PrivateMatchFeedbackEntry'}, description: Assigned-manager projection only; never present in a player view}
    NamedWorkspaceMembership:
      type: object
      additionalProperties: false
      required: [accountId, teamId, seasonId, role]
      properties:
        accountId: {$ref: '#/components/schemas/Identifier'}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        role: {enum: [administrator, manager, player, spectator]}
        playerId: {$ref: '#/components/schemas/Identifier'}
        expiresAt: {type: [integer, 'null'], minimum: 0}
        revokedAt: {type: [integer, 'null'], minimum: 0}
        teamName: {type: string, minLength: 1, maxLength: 120, description: Optional server-bound display name including the current age group when known}
        clubName: {type: string, minLength: 1, maxLength: 120}
        seasonLabel: {type: string, minLength: 1, maxLength: 120}
    ReportExportRequest:
      type: object
      additionalProperties: false
      required: [kind, teamId, seasonId, format]
      properties:
        kind: {enum: [own_participation, team_participation, attendance, match_summary, season_results]}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        matchId: {type: [string, 'null'], maxLength: 150, description: Required only for match_summary; absent or null for other kinds}
        format: {enum: [csv, pdf]}
    ReportExportStatus:
      type: object
      additionalProperties: false
      required: [id, status, downloadPath, expiresAt, failureCode, publicationPolicyVersions, generatedAt]
      properties:
        id: {type: string, format: uuid}
        status: {enum: [queued, working, ready, failed, expired]}
        downloadPath: {type: [string, 'null'], description: 'Only ready jobs have /v1/exports/<UUID>/download; always authenticated'}
        expiresAt: {type: string, format: date-time}
        failureCode: {type: [string, 'null'], pattern: '^[A-Z0-9_]{1,80}$'}
        publicationPolicyVersions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [policyId, version]
            properties:
              policyId: {type: string}
              version: {type: integer, minimum: 0}
        generatedAt: {type: [string, 'null'], format: date-time}
    OfflinePlayerSnapshot:
      type: object
      additionalProperties: false
      required:
      - id
      - displayName
      - goalkeeperChoice
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        displayName:
          type: string
        goalkeeperChoice:
          type: integer
          minimum: 0
        positionPreferences:
          type: array
          items:
            type: string
        profileVersion:
          type: string
        available:
          type: boolean
          description: Preserved legacy fictional selection metadata; never manager attendance or proof of playing
    OfflineMatchProjection:
      type: object
      additionalProperties: false
      required:
      - config
      - status
      - revision
      - attendance
      - availability
      - stagedLineup
      - lineup
      - half
      - halfActiveMs
      - matchActiveMs
      - firstHalfDurationMs
      - anchor
      - recoveryRequired
      - intervals
      - targetIntervals
      - score
      - halfTimeScore
      - completedAtMs
      - completedTimeQuality
      - recoveryReason
      - appliedEvents
      properties:
        config:
          type: object
          additionalProperties: false
          required:
          - matchId
          - players
          - selectedPlayerIds
          - pitchPlaces
          - plannedHalfDurationMs
          - fixedKeeperId
          properties:
            matchId:
              $ref: '#/components/schemas/Identifier'
            players:
              type: array
              items:
                $ref: '#/components/schemas/OfflinePlayerSnapshot'
              maxItems: 100
            selectedPlayerIds:
              type: array
              items:
                $ref: '#/components/schemas/Identifier'
              maxItems: 100
            pitchPlaces:
              type: integer
              minimum: 5
              maximum: 11
            plannedHalfDurationMs:
              type: integer
              minimum: 1
            fixedKeeperId:
              anyOf:
              - $ref: '#/components/schemas/Identifier'
              - type: 'null'
            initialPolicyProposal:
              type: object
            initialLineupProposal:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - slotId
                - position
                - playerId
                properties:
                  slotId:
                    $ref: '#/components/schemas/Identifier'
                  position:
                    type: string
                  playerId:
                    $ref: '#/components/schemas/Identifier'
              maxItems: 11
            initialAttendance:
              type: object
              additionalProperties:
                enum:
                - present
                - absent
                - excused
                - not_selected
                - not_recorded
            slots:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - slotId
                - position
                properties:
                  slotId:
                    $ref: '#/components/schemas/Identifier'
                  position:
                    type: string
                  x:
                    type: number
                  y:
                    type: number
                  label:
                    type: string
              maxItems: 11
            fixture:
              type: object
              additionalProperties: false
              required:
              - opponent
              - playedDate
              - kickoff
              - homeAway
              - seasonId
              - teamId
              - teamName
              - clubName
              properties:
                opponent:
                  type: string
                playedDate:
                  type: string
                  format: date
                kickoff:
                  anyOf:
                  - type: string
                  - type: 'null'
                homeAway:
                  enum:
                  - home
                  - away
                seasonId:
                  $ref: '#/components/schemas/Identifier'
                teamId:
                  $ref: '#/components/schemas/Identifier'
                teamName:
                  type: string
                clubName:
                  type: string
            profileSnapshot:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - playerId
                - preferences
                - eligiblePositions
                - initials
                properties:
                  playerId:
                    $ref: '#/components/schemas/Identifier'
                  preferences:
                    type: array
                    items:
                      type: string
                  eligiblePositions:
                    type: array
                    items:
                      type: string
                  initials:
                    type: string
              maxItems: 100
        status:
          enum:
          - preparation
          - first_half_running
          - first_half_paused
          - half_time
          - second_half_running
          - second_half_paused
          - completed
          - abandoned
        revision:
          type: integer
          minimum: 0
        attendance:
          type: object
        availability:
          type: object
        stagedLineup:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - slotId
            - position
            - playerId
            properties:
              slotId:
                $ref: '#/components/schemas/Identifier'
              position:
                type: string
              playerId:
                $ref: '#/components/schemas/Identifier'
          maxItems: 11
        lineup:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - slotId
            - position
            - playerId
            properties:
              slotId:
                $ref: '#/components/schemas/Identifier'
              position:
                type: string
              playerId:
                $ref: '#/components/schemas/Identifier'
          maxItems: 11
        half:
          enum:
          - 0
          - 1
          - 2
        halfActiveMs:
          type: integer
          minimum: 0
        matchActiveMs:
          type: integer
          minimum: 0
        firstHalfDurationMs:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        anchor:
          anyOf:
          - type: object
          - type: 'null'
        recoveryRequired:
          type: boolean
        intervals:
          type: array
          items:
            type: object
        targetIntervals:
          type: array
          items:
            type: object
        score:
          type: object
          additionalProperties: false
          required:
          - for
          - against
          properties:
            for:
              type: integer
              minimum: 0
            against:
              type: integer
              minimum: 0
        halfTimeScore:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - for
            - against
            properties:
              for:
                type: integer
                minimum: 0
              against:
                type: integer
                minimum: 0
          - type: 'null'
        completedAtMs:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        completedTimeQuality:
          enum:
          - reviewRequired
          - null
        abandonedAtMs:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        abandonReason:
          enum:
          - weather
          - safety
          - insufficient_players
          - other
          - null
        recoveryReason:
          anyOf:
          - type: string
          - type: 'null'
        appliedEvents:
          type: object
          additionalProperties:
            type: string
        schemaVersion:
          const: 2
        goals:
          type: array
          items:
            type: object
        availabilityHistory:
          type: array
          items:
            type: object
        eventHistory:
          type: array
          items:
            type: object
          maxItems: 10000
        audit:
          type: array
          items:
            type: object
        activePolicy:
          type: object
        policyHistory:
          type: array
          items:
            type: object
      description: Current deterministic MatchState schema. Optional legacy fields preserve original evidence. Detailed events/rules
        are enforced by the domain engine; only match-time profiles occur here, never account contacts or birth dates.
    OfflinePublication:
      type: object
      additionalProperties: false
      required:
      - fixtureClass
      - classificationVersion
      - resultPolicy
      - sharingPolicy
      properties:
        fixtureClass:
          anyOf:
          - enum:
            - development
            - friendly
            - trophy
            - unclassified
          - type: 'null'
        classificationVersion:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        resultPolicy:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - id
            - version
            - fixtureClass
            - confirmed
            - confirmationReference
            - allowedRoles
            properties:
              id:
                $ref: '#/components/schemas/Identifier'
              version:
                type: integer
                minimum: 1
              fixtureClass:
                enum:
                - development
                - friendly
                - trophy
                - unclassified
              confirmed:
                type: boolean
              confirmationReference:
                anyOf:
                - type: string
                - type: 'null'
              allowedRoles:
                type: array
                items:
                  enum:
                  - player
                  - spectator
          - type: 'null'
        sharingPolicy:
          type: object
          additionalProperties: false
          required:
          - version
          - approvedBy
          - approvedAt
          - shareScores
          - shareDerivedResults
          properties:
            version:
              type: string
            approvedBy:
              anyOf:
              - $ref: '#/components/schemas/Identifier'
              - type: 'null'
            approvedAt:
              anyOf:
              - type: integer
                minimum: 0
              - type: 'null'
            shareScores:
              type: boolean
            shareDerivedResults:
              type: boolean
      description: Only actually recorded classification/publication. Null means unknown; inclusion never approves sharing. Re-evaluate
        online on later policy changes.
    AcceptedHistoricalWireEvent:
      type: object
      additionalProperties: false
      required:
      - contractVersion
      - schemaVersion
      - engineVersion
      - eventId
      - matchId
      - deviceId
      - controllerEpoch
      - clientSequence
      - previousEventId
      - baseRevision
      - effectiveHalf
      - halfElapsedMs
      - matchElapsedMs
      - effectiveAt
      - recordedAt
      - timeQuality
      - clockEvidence
      - command
      properties:
        contractVersion:
          type: string
          minLength: 1
        schemaVersion:
          type: integer
          minimum: 1
        engineVersion:
          type: string
          minLength: 1
        eventId:
          $ref: '#/components/schemas/Identifier'
        matchId:
          $ref: '#/components/schemas/Identifier'
        deviceId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,120}$
        controllerEpoch:
          type: integer
          minimum: 1
        clientSequence:
          type: integer
          minimum: 1
        previousEventId:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        baseRevision:
          type: integer
          minimum: 0
        effectiveHalf:
          type: integer
          enum:
          - 0
          - 1
          - 2
        halfElapsedMs:
          type: integer
          minimum: 0
        matchElapsedMs:
          type: integer
          minimum: 0
        effectiveAt:
          type:
          - string
          - 'null'
          format: date-time
        recordedAt:
          type: string
          format: date-time
        timeQuality:
          enum:
          - anchored
          - estimated
          - reviewRequired
        clockEvidence:
          type: object
          additionalProperties: false
          required:
          - monotonicMs
          - anchorId
          - continuityId
          properties:
            monotonicMs:
              type: number
              minimum: 0
            anchorId:
