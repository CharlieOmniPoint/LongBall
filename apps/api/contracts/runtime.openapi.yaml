openapi: 3.1.0
info:
  title: LongBall implemented runtime extensions
  version: 1.8.0
  description: >-
    Runtime additions beside the unchanged supplied canonical contract. Server
    authorization, explicit policy decisions and native-device acceptance remain
    independent. Ordinary mutations require the event contract version and an exact
    stable idempotency key. Schema details for preparation and records commands are
    maintained by their strict parsers in packages/application/src.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: readOwnWorkspaceIdentity
      summary: Read the signed-in identity and its current named workspace choices
      description: Display names are optional metadata from the exact authorized team-season. They never replace opaque IDs, selected role or player binding and do not grant preparation or roster access.
      responses:
        '200':
          description: Current own identity and memberships only; private, no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accountId, identityClassification, principal, memberships, serverTime, syntheticOnly]
                properties:
                  accountId: {$ref: '#/components/schemas/Identifier'}
                  identityClassification: {enum: [child_shared, adult_individual, unclassified]}
                  principal: {type: object, description: Current authenticated runtime principal; no credentials}
                  memberships:
                    type: array
                    items: {$ref: '#/components/schemas/NamedWorkspaceMembership'}
                  serverTime: {type: string, format: date-time}
                  syntheticOnly: {type: boolean}
        '401': {description: A current authenticated identity is required}
        '403': {description: The account is unavailable}
  /exports:
    post:
      operationId: createProtectedReportExport
      summary: Queue a requester-bound CSV or PDF report
      description: >-
        Implements the canonical report-export job contract. Own participation is player-only;
        team participation is manager-only; attendance excludes spectators and players receive
        only their own records. Match and season summaries retain current publication policy.
        The role-filtered snapshot and generated artifact are encrypted at rest. A separate
        leased worker creates the file. Current identity, membership, role, source fingerprint
        and sharing policy are rechecked before delivery. No public download token is issued.
        Export capability requires an explicit private key and artifact TTL; no deployment or
        privacy-retention approval is inferred. Legacy synchronous JSON/CSV remains available.
      parameters:
      - $ref: '#/components/parameters/SelectedRole'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ContractVersion'
      - name: If-Match
        in: header
        required: false
        schema: {type: string, pattern: '^"(?:0|[1-9][0-9]{0,14})"$'}
        description: Optional exact quoted records projection revision. A supplied stale revision is rejected. An absent header captures the current transaction snapshot. The idempotency signature includes this header.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportExportRequest'}
      responses:
        '202':
          description: Durable queued export; private, no-store
          content: {application/json: {schema: {$ref: '#/components/schemas/ReportExportStatus'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {description: The filtered snapshot exceeds the five MiB report limit}
        '503': {description: EXPORT_NOT_CONFIGURED; configure a private encryption key and explicit artifact TTL}
  /exports/{exportId}:
    parameters:
    - $ref: '#/components/parameters/ReportExportId'
    - $ref: '#/components/parameters/SelectedRole'
    get:
      operationId: readProtectedReportExport
      summary: Read current requester-bound export status
      responses:
        '200':
          description: Current state; expired or invalidated bytes are cleared, private, no-store
          content: {application/json: {schema: {$ref: '#/components/schemas/ReportExportStatus'}}}
        '404': {$ref: '#/components/responses/Unavailable'}
  /exports/{exportId}/download:
    parameters:
    - $ref: '#/components/parameters/ReportExportId'
    - $ref: '#/components/parameters/SelectedRole'
    get:
      operationId: downloadProtectedReportExport
      summary: Download a ready file after fresh access and policy checks
      description: At most five MiB. Authenticated downloadPath is relative to this API. Content-Disposition uses only the opaque export UUID. Cross-origin allowed responses expose its attachment header. Saved external copies remain under the recipient's control.
      responses:
        '200':
          description: Authenticated binary attachment; Cache-Control private, no-store; exact Content-Length and sanitized Content-Disposition
          headers:
            Content-Disposition: {schema: {type: string}, description: 'attachment; filename="longball-report-<UUID>.csv|pdf"'}
            Content-Length: {schema: {type: integer, minimum: 1, maximum: 5242880}}
          content:
            application/pdf: {schema: {type: string, format: binary}}
            text/csv: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {description: 'Export is not ready, source/policy changed, key changed or encrypted artifact verification failed; request a fresh report'}
        '410': {description: EXPORT_EXPIRED; encrypted bytes were cleared}
  /matches/{matchId}/download:
    parameters:
    - $ref: '#/components/parameters/MatchId'
    - $ref: '#/components/parameters/SelectedRole'
    - name: deviceId
      in: query
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,120}$
    get:
      operationId: downloadVerifiedManagerCheckpoint
      summary: Read assigned-manager accepted checkpoint without acquiring authority
      description: Requires current adult assigned manager. Controller metadata is observation only and never grants recording
        authority. Another manager can inspect this checkpoint without acquiring a capability. Snapshot schema1 is independent
        of wire schema1 and engine4. Checksum covers every canonical payload field except checksumSha256. Client verifies before
        atomic journal install; old unsigned caches remain retained but need a verified refresh before capture. Accepted envelopes
        keep original engine versions; control transitions retain separate actual IDs/epochs. State.config contains immutable
        fixture/rules/player/formation snapshots; state.lineup/stagedLineup and clock checkpoint are part of the same snapshot.
        No contacts, birth dates, ballots or galleries.
      responses:
        '200':
          description: One complete consistent verified snapshot; private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedMatchSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/Unavailable'
        '422':
          description: OFFLINE_BUNDLE_UNSUPPORTED; history beyond10000 records or incomplete/inconsistent evidence is rejected
            without truncation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /matches/{matchId}/offline-bundle:
    parameters:
    - $ref: '#/components/parameters/MatchId'
    - $ref: '#/components/parameters/SelectedRole'
    - name: deviceId
      in: query
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,120}$
    - $ref: '#/components/parameters/ControllerToken'
    get:
      operationId: downloadVerifiedControllerBundle
      summary: Download complete controller offline snapshot
      description: Requires current adult manager, matching unfrozen controller capability and its enrolled device. Authority
        cannot change during the transaction. Capability stays in the separately encrypted local grant; the response never issues
        or reveals it. Snapshot schema1 is independent of wire schema1 and engine4. Checksum covers every canonical payload
        field except checksumSha256. Client verifies before atomic journal install; old unsigned caches remain retained but
        need a verified refresh before capture. Accepted envelopes keep original engine versions; control transitions retain
        separate actual IDs/epochs. State.config contains immutable fixture/rules/player/formation snapshots; state.lineup/stagedLineup
        and clock checkpoint are part of the same snapshot. No contacts, birth dates, ballots or galleries.
      responses:
        '200':
          description: One complete consistent verified snapshot; private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedMatchSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/Unavailable'
        '422':
          description: OFFLINE_BUNDLE_UNSUPPORTED; history beyond10000 records or incomplete/inconsistent evidence is rejected
            without truncation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
  /teams/{teamId}/matches:
    parameters:
    - $ref: '#/components/parameters/TeamId'
    - $ref: '#/components/parameters/SeasonId'
    - $ref: '#/components/parameters/SelectedRole'
    get:
      operationId: listCurrentScopeMatches
      summary: Read a typed, role-filtered page of current-scope matches
      description: Fresh verified membership and selected audience apply on every page. Only seasonId, limit, cursor and status query
        keys are accepted, once each. Cursor binds verified account/issuer/subject, team, season, effective audience and player
        identity and status filter; it never grants authority. Stable binary match-ID ordering. A missing or withdrawn row is not exposed by a
        continuation. status=active selects running or paused halves and half-time before paging so foreground viewers can discover live games beyond the first history page.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: [active]
        description: Optional active-match selection; omitted returns all match states. Preserve it on continuation requests.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
        description: Opaque scope-bound continuation from the previous page
      responses:
        '200':
          description: Role-filtered items, nullable continuation and server observation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMatchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/Unavailable'
  /matches/{matchId}/events:
    parameters:
      - {$ref: '#/components/parameters/MatchId'}
      - {$ref: '#/components/parameters/SelectedRole'}
      - {$ref: '#/components/parameters/ContractVersion'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControllerToken'}
    post:
      operationId: uploadVersionedMatchCommands
      summary: Upload an exact ordered controller stream, including prospective policy confirmations
      description: >-
        Current manager membership, held controller capability, epoch, per-device
        sequence, preceding event, source revision and effective time are checked by
        the service and deterministic engine. The service binds actorId. Exact retries
        reuse their original bytes and idempotency key. Unsupported engine events
        remain retained in quarantine; v3 pending evidence is never relabelled v4.
        Policy versions are prospective; keeper transitions remain Q07-unapproved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: {$ref: '#/components/schemas/MatchCommandEnvelope'}
      responses:
        '200':
          description: Per-event accepted or quarantined dispositions; acceptance is distinct from local persistence
          content: {application/json: {schema: {$ref: '#/components/schemas/MatchUploadReceipt'}}}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Conflict'}
  /me/push-registrations:
    get:
      operationId: getOwnPushRegistrationStatus
      summary: Read own enrolled-device push metadata and configured platform policies
      description: >-
        Requires the active verified account; team membership and selected role are
        not required. Returns no token, digest, ciphertext, key material or other
        account's devices. Registration configuration and actual delivery provider
        configuration are independent; neither flag establishes notification delivery.
      responses:
        '200':
          description: Own-account metadata only; private, no-store
          content: {application/json: {schema: {$ref: '#/components/schemas/AccountPushStatus'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      operationId: registerOwnEnrolledPushDevice
      summary: Register or rotate a configured delivery destination for an own enrolled native device
      parameters:
        - {$ref: '#/components/parameters/ContractVersion'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/PushIfMatch'}
      description: >-
        The account and issuer come from the active verified session. The native
        device and reported platform must match that account's current enrollment.
        Only the configured transport is accepted. A token is delivery metadata,
        never authentication. If-Match is the exact quoted current device revision,
        including "0" when no registration exists. The body and revision are bound
        to the stable idempotency key. Exact retries recheck current enrollment and
        configuration, and return the original metadata receipt without reactivating
        a withdrawn destination. Changed token, permission, build, processor binding
        or encryption key advances the revision; an identical current-key registration
        may return its existing revision. Denied permission requires withdrawal.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PushRegistrationInput'}}}
      responses:
        '200':
          description: Canonical MutationResult fields; no token material
          content: {application/json: {schema: {$ref: '#/components/schemas/PushRegistrationMutationResult'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/PushConflict'}
        '428': {$ref: '#/components/responses/PushRevisionRequired'}
        '503': {$ref: '#/components/responses/PushConfigurationRequired'}
  /me/push-registrations/{deviceId}:
    parameters:
      - {$ref: '#/components/parameters/PushDeviceId'}
    delete:
      operationId: withdrawOwnEnrolledPushDevice
      summary: Withdraw an own push registration while retaining its revision tombstone
      parameters:
        - {$ref: '#/components/parameters/ContractVersion'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/PushIfMatch'}
      description: >-
        Requires the same active account, issuer and enrolled native device. Send
        the quoted current revision, or "0" if absent. Clears encrypted token
        material and records a new revision tombstone atomically. The path device
        and revision bind the idempotency receipt. Exact retries return the original
        acknowledgement; a stale registration cannot overtake withdrawal. Withdrawal
        remains available when registration configuration is disabled. This endpoint
        does not revoke account sessions, native enrollment or match-controller authority.
      responses:
        '202':
          description: Canonical Accepted fields with status completed; private metadata acknowledgement
          content: {application/json: {schema: {$ref: '#/components/schemas/PushRegistrationWithdrawalAccepted'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/PushConflict'}
        '428': {$ref: '#/components/responses/PushRevisionRequired'}
  /teams/{teamId}/privileges:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
      - {$ref: '#/components/parameters/SeasonId'}
      - {$ref: '#/components/parameters/SelectedRole'}
    get:
      operationId: getManagerTeamPrivilegeStatus
      summary: Read current manager-visible contribution restrictions
      description: >-
        Requires current verified-adult strong-authentication authority and an assigned manager in the selected
        team/season context. An omitted role uses the service's verified membership
        selection; selecting a different role does not combine its authority with
        manager membership. The revision is team-wide across seasons. This view
        includes eligible target labels and flags, without reasons or private notes.
      responses:
        '200':
          description: Current scoped manager status only
          content: {application/json: {schema: {$ref: '#/components/schemas/TeamPrivilegesView'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AdultAuthorityRequired'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/TeamPrivilegeConflict'}
        '503': {$ref: '#/components/responses/TeamPrivilegesUnavailable'}
    post:
      operationId: recordTeamPrivilegeDecision
      summary: Explicitly suspend or reinstate one target's uploads or invitations in this team
      parameters:
        - {$ref: '#/components/parameters/ContractVersion'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      description: >-
        Requires current verified-adult strong-authentication and assigned-manager authority in the current team/season
        and an eligible target. command.id must equal Idempotency-Key. The body
        expectedRevision is the current team-wide ledger revision; this endpoint
        uses no If-Match header. Confirmed decision, reason, optional private note,
        ledger revision, immutable audit and exact receipt commit together. Exact
        retries retain their command bytes and identity. Suspension prevents later
        contribution writes with TEAM_UPLOADS_SUSPENDED or TEAM_INVITATIONS_SUSPENDED
        (403); it does not erase existing media, revoke invitations/grants or remove
        published photos. Reinstatement restores only this contribution permission.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TeamPrivilegeRequest'}}}
      responses:
        '200':
          description: Atomic revision and command acknowledgement without reasons or private notes
          content: {application/json: {schema: {$ref: '#/components/schemas/TeamPrivilegeReceipt'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AdultAuthorityRequired'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/TeamPrivilegeConflict'}
        '503': {$ref: '#/components/responses/TeamPrivilegesUnavailable'}
  /teams/{teamId}/privileges/own:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
      - {$ref: '#/components/parameters/SeasonId'}
      - {$ref: '#/components/parameters/SelectedRole'}
    get:
      operationId: getOwnTeamContributionPrivileges
      summary: Read only the current account's contribution flags for this team and season
      description: >-
        Rechecks the current selected membership. Only eligible managers/players
        can have allowed contribution flags; a current spectator receives false
        flags. No manager ledger revision, target directory, reason or private note
        is exposed by this own-account response.
      responses:
        '200':
          description: Own flags only
          content: {application/json: {schema: {$ref: '#/components/schemas/OwnTeamPrivileges'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AdultAuthorityRequired'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/TeamPrivilegeConflict'}
        '503': {$ref: '#/components/responses/TeamPrivilegesUnavailable'}
  /identity/devices:
    get:
      operationId: listOwnRecognisedDevices
      summary: Read the authenticated account's recognised installation metadata
      description: No device credentials, push tokens, advertising IDs, other account metadata or remote-revocation action is exposed. Unknown legacy metadata stays null. A device identifier is not authentication or match-controller authority.
      responses:
        '200':
          description: Own recognised devices only; Cache-Control private, no-store
          content: {application/json: {schema: {$ref: '#/components/schemas/RecognisedDevices'}}}
        '404': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: enrolOwnNativeInstallation
      summary: Record a reported native installation for the current account
      parameters:
        - {$ref: '#/components/parameters/ContractVersion'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      description: The account and issuer come from the verified session. Times come from the service. The reported platform remains unverified and confers no controller authority. An existing installation cannot be transferred to another account.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NativeDeviceInput'}}}
      responses:
        '200':
          description: Current own recognised devices
          content: {application/json: {schema: {$ref: '#/components/schemas/RecognisedDevices'}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /teams/{teamId}/spectator-invites:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
      - {$ref: '#/components/parameters/SelectedRole'}
    get:
      operationId: listCurrentSpectatorInvitations
      summary: List safe invitation summaries for a current manager or the original current player
      parameters:
        - {$ref: '#/components/parameters/SeasonId'}
      responses:
        '200':
          description: No plaintext token, verifier, share URL or private account directory
          content: {application/json: {schema: {$ref: '#/components/schemas/InvitationList'}}}
        '404': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: issueServerGeneratedSpectatorInvitation
      summary: Issue a single-use spectator credential without a player approval step
      description: The season comes from the body; a contradictory query is refused. The service CSPRNG generates 32 bytes and stores only a domain-separated SHA-256 verifier. Explicit expiry is 1–48 hours and bounded by the selected season. No proposed default or player invitation cap is silently selected. The raw share URL is returned once and remains memory-only; it never enters generic outboxes, logs or durable receipts.
      parameters:
        - {$ref: '#/components/parameters/ContractVersion'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/InvitationWrite'}}}
      responses:
        '201':
          description: First response contains the one-time credential in the configured app entry URL fragment
          content: {application/json: {schema: {$ref: '#/components/schemas/InvitationCreated'}}}
        '200':
          description: Exact retry returns retained metadata only; explicitly reissue if the first credential was lost
          content: {application/json: {schema: {$ref: '#/components/schemas/RedactedInvitationReceipt'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/PolicyRequired'}
  /teams/{teamId}/spectator-invites/{invitationId}/reissue:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
      - {$ref: '#/components/parameters/InvitationId'}
      - {$ref: '#/components/parameters/SelectedRole'}
      - {$ref: '#/components/parameters/ContractVersion'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: explicitlyReissuePendingSpectatorInvitation
      summary: Atomically retire a pending link and issue its explicit replacement
      description: Only its original current player or a current manager may reissue. An accepted invitation or grant cannot be rotated. Legacy plaintext credentials remain retired. Source identity and original retirement evidence remain retained; a second replacement from the same source is refused. The new raw credential is returned once, with a redacted durable retry receipt.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/InvitationWrite'}}}
      responses:
        '201':
          description: Explicit replacement with one-time share URL
          content: {application/json: {schema: {$ref: '#/components/schemas/InvitationCreated'}}}
        '200':
          description: Exact retry contains no raw credential
          content: {application/json: {schema: {$ref: '#/components/schemas/RedactedInvitationReceipt'}}}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Conflict'}
  /teams/{teamId}/spectator-invites/{invitationId}:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
      - {$ref: '#/components/parameters/InvitationId'}
      - {$ref: '#/components/parameters/SeasonId'}
      - {$ref: '#/components/parameters/SelectedRole'}
      - {$ref: '#/components/parameters/ContractVersion'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    delete:
      operationId: revokeInvitationAndItsGrant
      summary: A current manager revokes the invitation and its associated future grant access
      description: The verifier mirror, retained community evidence and spectator membership union update in one transaction. Other accepted grants, unrelated roles and historical records remain intact. No account is deleted.
      responses:
        '200':
          description: Immutable revocation acknowledgement; current permissions are re-read separately
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitationId, revoked]
                properties:
                  invitationId: {$ref: '#/components/schemas/Identifier'}
                  revoked: {const: true}
        '404': {$ref: '#/components/responses/Unavailable'}
  /spectator-invites/inspect:
    post:
      operationId: inspectPossessedInvitationDestination
      summary: Confirm the actual invitation destination before authenticated acceptance
      description: Read-only lookup for the exact server-hashed token and current authenticated account. Link-supplied team, season and labels do not authorize a destination. Returns only current club/team/age-group/season context and a role-only inviter label. No account, session, grant or receipt is created; no person name, verifier, token, roster or contact is returned.
      parameters:
        - {$ref: '#/components/parameters/ContractVersion'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/InvitationTokenInput'}}}
      responses:
        '200':
          description: Safe token-bound destination metadata
          content: {application/json: {schema: {$ref: '#/components/schemas/InvitationInspection'}}}
        '404': {$ref: '#/components/responses/Unavailable'}
  /spectator-invites/accept:
    post:
      operationId: acceptServerVerifiedSpectatorInvitation
      summary: Accept a possessed single-use invitation into the signed-in global account
      description: No prior destination membership is required. The service resolves the exact raw token into a scoped verifier context before its transaction. The accepted grant ends at the recorded Europe/London season boundary; invitation expiry is separate. No name matching, automatic identity linking, duplicate account or adult authority is created. Raw token and exact retries remain memory-only; durable receipts contain safe acknowledgement fields only. Refresh current memberships after acceptance.
      parameters:
        - {$ref: '#/components/parameters/ContractVersion'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/InvitationTokenInput'}}}
      responses:
        '200':
          description: Accepted grant acknowledgement; includes no authentication or private team data
          content: {application/json: {schema: {$ref: '#/components/schemas/InvitationDestination'}}}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Conflict'}
  /spectator-invites/activation-info:
    post:
      operationId: getFirstSpectatorActivationPolicy
      summary: Read the exact pending invitation's configured activation policy
      security: []
      parameters:
        - {$ref: '#/components/parameters/ContractVersion'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/InvitationTokenInput'}}}
      responses:
        '200':
          description: Minimal exact-token destination context, expiry and policy; creates no account or access
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitationId, teamId, seasonId, expiresAt, policyVersion, context]
                properties:
                  invitationId: {$ref: '#/components/schemas/Identifier'}
                  teamId: {$ref: '#/components/schemas/Identifier'}
                  seasonId: {$ref: '#/components/schemas/Identifier'}
                  expiresAt: {type: string, format: date-time}
                  policyVersion: {$ref: '#/components/schemas/Identifier'}
                  context: {$ref: '#/components/schemas/InvitationContext'}
        '410': {$ref: '#/components/responses/Unavailable'}
        '429': {description: The bounded capability request window has been reached}
        '503': {$ref: '#/components/responses/PolicyRequired'}
  /spectator-invites/activate:
    post:
      operationId: beginFirstSpectatorUsernameActivation
      summary: Provision a pending username identity for the possessed invitation
      security: []
      description: Requires explicit configured provider and activation policy. A reserved identity stays unclassified and disabled until exact provider completion. The provider URL never contains the invitation token. Its sole nonsecret longballActivation fragment identifies the attempt and is removed before opening the trusted provider. Completion alone creates no membership or app session; sign in with PKCE and explicitly accept the invitation afterwards. Existing-account users sign in directly.
      parameters:
        - {$ref: '#/components/parameters/ContractVersion'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, deviceId, policyVersion]
              properties:
                token: {$ref: '#/components/schemas/InvitationToken'}
                deviceId: {$ref: '#/components/schemas/Identifier'}
                policyVersion: {$ref: '#/components/schemas/Identifier'}
      responses:
        '200':
          description: Trusted provider setup link without invitation secret or application credentials
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accountId, username, identityActionUrl, expiresAt]
                properties:
                  accountId: {$ref: '#/components/schemas/Identifier'}
                  username: {type: string, minLength: 1}
                  identityActionUrl: {type: string, format: uri}
                  expiresAt: {type: string, format: date-time}
        '410': {$ref: '#/components/responses/Unavailable'}
        '429': {description: The bounded capability request window has been reached}
        '503': {$ref: '#/components/responses/PolicyRequired'}
  /activation/complete:
    post:
      operationId: completeOriginalTokenActivation
      summary: Verify provider completion for the exact original household or spectator activation capability
      security: []
      description: The original opaque token and activation ID resolve exactly one household or spectator family before provider I/O. Actual provider proof is verified outside the transaction before an atomic capability-bound completion. The token remains memory-only; a cold return requires the original token again. This operation creates no membership or app session and never returns credentials or recovery material.
      parameters:
        - {$ref: '#/components/parameters/ContractVersion'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [activationId, token, completionProof]
              properties:
                activationId: {type: string, format: uuid}
                token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true}
                completionProof: {type: string, minLength: 1, maxLength: 16384, writeOnly: true}
      responses:
        '200':
          description: Completion requires a separate sign-in; no application session is created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, signInRequired]
                properties:
                  status: {const: complete}
                  signInRequired: {const: true}
        '404': {$ref: '#/components/responses/Unavailable'}
        '410': {$ref: '#/components/responses/Unavailable'}
        '429': {description: The bounded activation attempt window has been reached}
        '503': {$ref: '#/components/responses/PolicyRequired'}
  /matches/{matchId}/clock/challenges:
    parameters:
      - {$ref: '#/components/parameters/MatchId'}
      - {$ref: '#/components/parameters/ContractVersion'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControllerToken'}
    post:
      operationId: issueControllerClockChallenge
      summary: Establish a single-use server-observed continuous-clock challenge
      description: Requires current controller authority and an explicitly configured trusted-time policy. Device wall time is never evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceId, controllerEpoch, continuityId]
              properties:
                deviceId: {$ref: '#/components/schemas/Identifier'}
                controllerEpoch: {type: integer, minimum: 1}
                continuityId: {$ref: '#/components/schemas/Identifier'}
      responses:
        '200': {description: Server-issued scoped challenge with original issue/expiry and policy identity}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/PolicyRequired'}
  /matches/{matchId}/clock/challenges/{challengeId}/acknowledge:
    parameters:
      - {$ref: '#/components/parameters/MatchId'}
      - {name: challengeId, in: path, required: true, schema: {$ref: '#/components/schemas/Identifier'}}
      - {$ref: '#/components/parameters/ContractVersion'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControllerToken'}
    post:
      operationId: acknowledgeControllerClockChallenge
      summary: Consume a challenge and persist a bounded continuous-clock mapping
      description: >-
        A challenge is consumed transactionally. Replaying the exact request key
        returns its receipt. A new request cannot consume it again. The original
        controller, device, epoch and continuity must still match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [receivedMonotonicMs, sentMonotonicMs]
              properties:
                receivedMonotonicMs: {type: number, minimum: 0}
                sentMonotonicMs: {type: number, minimum: 0}
      responses:
        '200': {description: 'Persisted mapping with original validity, offset interval and policy identity'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/PolicyRequired'}
  /teams/{teamId}/seasons/rollover-options:
