  /spectator-access/register:
    post:
      operationId: registerInvitedSpectatorPinAccount
      summary: Redeem a scoped invitation and set a spectator username and PIN
      security: []
      description: Anonymous capability redemption accepts exactly four fields; requestId is a stable body identity
        and event mutation headers are not used. A live invitation, unique username and exactly four decimal passcode
        digits are required. The current application sign-in rules govern new username length/characters and whether
        easily guessed PINs are refused; this check occurs on the server even if a client has stale rule metadata.
        Salted scrypt verifiers are stored, not PIN plaintext. This creates an unclassified spectator
        identity and exactly the invitation membership; it never creates adult, manager or player authority. The first
        successful response creates an in-memory session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpectatorRegistrationInput'
      responses:
        '201':
          description: Current authorized, private no-store response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpectatorSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Bounded authentication/request rate limit; retry later
  /spectator-access/login:
    post:
      operationId: loginSpectatorPinAccount
      summary: Sign in to an existing spectator-only PIN account
      security: []
      description: Anonymous login checks the normalized username and four-digit passcode with constant-time verifier
        comparison. Generic credential failures avoid username disclosure. Source-address attempts and concurrent
        derivations are bounded; five persisted account failures lock the username for 15 minutes. Sessions last six
        hours and service restart ends them; current memberships/grants are still checked for team data.
      requestBody:
        required: true
        content:
          application/json:
