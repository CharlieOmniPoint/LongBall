      security: []
      description: No authenticated account or event-contract headers are required. A live, unaccepted, unrevoked
        server-issued invitation token is required; only the exact invitation club/team/season metadata is returned.
        The raw capability is never returned or logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
