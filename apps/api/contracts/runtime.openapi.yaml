              matchId: {$ref: '#/components/schemas/Identifier'}
              label: {type: string}
              playedDate: {type: [string, 'null'], format: date}
              completedAtMs: {type: [integer, 'null'], minimum: 0}
              closesAtMs: {type: [integer, 'null'], minimum: 0}
              status: {enum: [open, closed, review_required]}
              eligible: {type: boolean}
              canEdit: {type: boolean}
              own: {oneOf: [{$ref: '#/components/schemas/PrivateMatchFeedbackEntry'}, {type: 'null'}]}
              entries: {type: array, items: {$ref: '#/components/schemas/PrivateMatchFeedbackEntry'}, description: Assigned-manager projection only; never present in a player view}
    NamedWorkspaceMembership:
      type: object
      additionalProperties: false
      required: [accountId, teamId, seasonId, role]
      properties:
        accountId: {$ref: '#/components/schemas/Identifier'}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        role: {enum: [administrator, manager, player, spectator]}
        administrativeInheritance: {const: true, description: Server-materialized club/system authority; never a caller role claim}
        playerId: {$ref: '#/components/schemas/Identifier'}
        expiresAt: {type: [integer, 'null'], minimum: 0}
        revokedAt: {type: [integer, 'null'], minimum: 0}
        teamName: {type: string, minLength: 1, maxLength: 120, description: Optional server-bound display name including the current age group when known}
        clubName: {type: string, minLength: 1, maxLength: 120}
        seasonLabel: {type: string, minLength: 1, maxLength: 120}
    ReportExportRequest:
      type: object
      additionalProperties: false
      required: [kind, teamId, seasonId, format]
      properties:
        kind: {enum: [own_participation, team_participation, attendance, match_summary, season_results]}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        matchId: {type: [string, 'null'], maxLength: 150, description: Required only for match_summary; absent or null for other kinds}
        format: {enum: [csv, pdf]}
    ReportExportStatus:
      type: object
      additionalProperties: false
      required: [id, status, downloadPath, expiresAt, failureCode, publicationPolicyVersions, generatedAt]
      properties:
        id: {type: string, format: uuid}
        status: {enum: [queued, working, ready, failed, expired]}
        downloadPath: {type: [string, 'null'], description: 'Only ready jobs have /v1/exports/<UUID>/download; always authenticated'}
        expiresAt: {type: string, format: date-time}
        failureCode: {type: [string, 'null'], pattern: '^[A-Z0-9_]{1,80}$'}
        publicationPolicyVersions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [policyId, version]
            properties:
              policyId: {type: string}
              version: {type: integer, minimum: 0}
        generatedAt: {type: [string, 'null'], format: date-time}
    OfflinePlayerSnapshot:
      type: object
      additionalProperties: false
      required:
      - id
      - displayName
      - goalkeeperChoice
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        displayName:
          type: string
        goalkeeperChoice:
          type: integer
          minimum: 0
        positionPreferences:
          type: array
          items:
            type: string
        profileVersion:
          type: string
        available:
          type: boolean
          description: Preserved legacy fictional selection metadata; never manager attendance or proof of playing
    OfflineMatchProjection:
      type: object
      additionalProperties: false
      required:
      - config
      - status
      - revision
      - attendance
      - availability
      - stagedLineup
      - lineup
      - half
      - halfActiveMs
      - matchActiveMs
      - firstHalfDurationMs
      - anchor
      - recoveryRequired
      - intervals
      - targetIntervals
      - score
      - halfTimeScore
      - completedAtMs
      - completedTimeQuality
      - recoveryReason
      - appliedEvents
      properties:
        config:
          type: object
          additionalProperties: false
          required:
          - matchId
          - players
          - selectedPlayerIds
          - pitchPlaces
          - plannedHalfDurationMs
          - fixedKeeperId
          properties:
            matchId:
              $ref: '#/components/schemas/Identifier'
            players:
              type: array
              items:
                $ref: '#/components/schemas/OfflinePlayerSnapshot'
              maxItems: 100
            selectedPlayerIds:
              type: array
              items:
                $ref: '#/components/schemas/Identifier'
              maxItems: 100
            pitchPlaces:
              type: integer
              minimum: 5
              maximum: 11
            plannedHalfDurationMs:
              type: integer
              minimum: 1
            fixedKeeperId:
              anyOf:
              - $ref: '#/components/schemas/Identifier'
              - type: 'null'
            initialPolicyProposal:
              type: object
            initialLineupProposal:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - slotId
                - position
                - playerId
                properties:
                  slotId:
                    $ref: '#/components/schemas/Identifier'
                  position:
                    type: string
                  playerId:
                    $ref: '#/components/schemas/Identifier'
              maxItems: 11
            initialAttendance:
              type: object
              additionalProperties:
                enum:
                - present
                - absent
                - excused
                - not_selected
                - not_recorded
            slots:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - slotId
                - position
                properties:
                  slotId:
                    $ref: '#/components/schemas/Identifier'
                  position:
                    type: string
                  x:
                    type: number
                  y:
                    type: number
                  label:
                    type: string
              maxItems: 11
            fixture:
              type: object
              additionalProperties: false
              required:
              - opponent
              - playedDate
              - kickoff
              - homeAway
              - seasonId
              - teamId
              - teamName
              - clubName
              properties:
                opponent:
                  type: string
                playedDate:
                  type: string
                  format: date
                kickoff:
                  anyOf:
                  - type: string
                  - type: 'null'
                homeAway:
                  enum:
                  - home
                  - away
                seasonId:
                  $ref: '#/components/schemas/Identifier'
                teamId:
                  $ref: '#/components/schemas/Identifier'
                teamName:
                  type: string
                clubName:
                  type: string
            profileSnapshot:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - playerId
                - preferences
                - eligiblePositions
                - initials
                properties:
                  playerId:
                    $ref: '#/components/schemas/Identifier'
                  preferences:
                    type: array
                    items:
                      type: string
                  eligiblePositions:
                    type: array
                    items:
                      type: string
                  initials:
                    type: string
              maxItems: 100
        status:
          enum:
          - preparation
          - first_half_running
          - first_half_paused
          - half_time
          - second_half_running
          - second_half_paused
          - completed
          - abandoned
        revision:
          type: integer
          minimum: 0
        attendance:
          type: object
        availability:
          type: object
        stagedLineup:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - slotId
            - position
            - playerId
            properties:
              slotId:
                $ref: '#/components/schemas/Identifier'
              position:
                type: string
              playerId:
                $ref: '#/components/schemas/Identifier'
          maxItems: 11
        lineup:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - slotId
            - position
            - playerId
            properties:
              slotId:
                $ref: '#/components/schemas/Identifier'
              position:
                type: string
              playerId:
                $ref: '#/components/schemas/Identifier'
          maxItems: 11
        half:
          enum:
          - 0
          - 1
          - 2
        halfActiveMs:
          type: integer
          minimum: 0
        matchActiveMs:
          type: integer
          minimum: 0
        firstHalfDurationMs:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        anchor:
          anyOf:
          - type: object
          - type: 'null'
        recoveryRequired:
          type: boolean
        intervals:
          type: array
          items:
            type: object
        targetIntervals:
          type: array
          items:
            type: object
        score:
          type: object
          additionalProperties: false
          required:
          - for
          - against
          properties:
            for:
              type: integer
              minimum: 0
            against:
              type: integer
              minimum: 0
        halfTimeScore:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - for
            - against
            properties:
              for:
                type: integer
                minimum: 0
              against:
                type: integer
                minimum: 0
          - type: 'null'
        completedAtMs:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        completedTimeQuality:
          enum:
          - reviewRequired
          - null
        abandonedAtMs:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        abandonReason:
          enum:
          - weather
          - safety
          - insufficient_players
          - other
          - null
        recoveryReason:
          anyOf:
          - type: string
          - type: 'null'
        appliedEvents:
          type: object
          additionalProperties:
            type: string
        schemaVersion:
          const: 2
        goals:
          type: array
          items:
            type: object
        availabilityHistory:
          type: array
          items:
            type: object
        eventHistory:
          type: array
          items:
            type: object
          maxItems: 10000
        audit:
          type: array
          items:
            type: object
        activePolicy:
          type: object
        policyHistory:
          type: array
          items:
            type: object
      description: Current deterministic MatchState schema. Optional legacy fields preserve original evidence. Detailed events/rules
        are enforced by the domain engine; only match-time profiles occur here, never account contacts or birth dates.
    OfflinePublication:
      type: object
      additionalProperties: false
      required:
      - fixtureClass
      - classificationVersion
      - resultPolicy
      - sharingPolicy
      properties:
        fixtureClass:
          anyOf:
          - enum:
            - development
            - friendly
            - trophy
            - unclassified
          - type: 'null'
        classificationVersion:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        resultPolicy:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - id
            - version
            - fixtureClass
            - confirmed
            - confirmationReference
            - allowedRoles
            properties:
              id:
                $ref: '#/components/schemas/Identifier'
              version:
                type: integer
                minimum: 1
              fixtureClass:
                enum:
                - development
                - friendly
                - trophy
                - unclassified
              confirmed:
                type: boolean
              confirmationReference:
                anyOf:
                - type: string
                - type: 'null'
              allowedRoles:
                type: array
                items:
                  enum:
                  - player
                  - spectator
          - type: 'null'
        sharingPolicy:
          type: object
          additionalProperties: false
          required:
          - version
          - approvedBy
          - approvedAt
          - shareScores
          - shareDerivedResults
          properties:
            version:
              type: string
            approvedBy:
              anyOf:
              - $ref: '#/components/schemas/Identifier'
              - type: 'null'
            approvedAt:
              anyOf:
              - type: integer
                minimum: 0
              - type: 'null'
            shareScores:
              type: boolean
            shareDerivedResults:
              type: boolean
      description: Only actually recorded classification/publication. Null means unknown; inclusion never approves sharing. Re-evaluate
        online on later policy changes.
    AcceptedHistoricalWireEvent:
      type: object
      additionalProperties: false
      required:
      - contractVersion
      - schemaVersion
      - engineVersion
      - eventId
      - matchId
      - deviceId
      - controllerEpoch
      - clientSequence
      - previousEventId
      - baseRevision
      - effectiveHalf
      - halfElapsedMs
      - matchElapsedMs
      - effectiveAt
      - recordedAt
      - timeQuality
      - clockEvidence
      - command
      properties:
        contractVersion:
          type: string
          minLength: 1
        schemaVersion:
          type: integer
          minimum: 1
        engineVersion:
          type: string
          minLength: 1
        eventId:
          $ref: '#/components/schemas/Identifier'
        matchId:
          $ref: '#/components/schemas/Identifier'
        deviceId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,120}$
        controllerEpoch:
          type: integer
          minimum: 1
        clientSequence:
          type: integer
          minimum: 1
        previousEventId:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        baseRevision:
          type: integer
          minimum: 0
        effectiveHalf:
          type: integer
          enum:
          - 0
          - 1
          - 2
        halfElapsedMs:
          type: integer
          minimum: 0
        matchElapsedMs:
          type: integer
          minimum: 0
        effectiveAt:
          type:
          - string
          - 'null'
          format: date-time
        recordedAt:
          type: string
          format: date-time
        timeQuality:
          enum:
          - anchored
          - estimated
          - reviewRequired
        clockEvidence:
          type: object
          additionalProperties: false
          required:
          - monotonicMs
          - anchorId
          - continuityId
          properties:
            monotonicMs:
              type: number
              minimum: 0
            anchorId:
              $ref: '#/components/schemas/Identifier'
            continuityId:
              anyOf:
              - $ref: '#/components/schemas/Identifier'
              - type: 'null'
        command:
          type: object
          required:
          - id
          - type
          - sample
          properties:
            id:
              $ref: '#/components/schemas/Identifier'
            type:
              type: string
            sample:
              $ref: '#/components/schemas/MatchClockSample'
      description: Original persisted accepted wire bytes as parsed JSON, including original schema/engine labels. Historical
        evidence is not relabelled or automatically replayed by a newer capture engine.
    OfflineAcceptedRecord:
      type: object
      additionalProperties: false
      required:
      - serverSequence
      - receivedAt
      - event
      properties:
        serverSequence:
          type: integer
          minimum: 1
        receivedAt:
          type: string
          format: date-time
        event:
          $ref: '#/components/schemas/AcceptedHistoricalWireEvent'
    OfflineControllerTransition:
      type: object
      additionalProperties: false
      required:
      - id
      - epoch
      - actorId
      - fromDevice
      - toDevice
      - kind
      - reason
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        epoch:
          type: integer
          minimum: 1
        actorId:
          $ref: '#/components/schemas/Identifier'
        fromDevice:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        toDevice:
          $ref: '#/components/schemas/Identifier'
        kind:
          type: string
        reason:
          anyOf:
          - type: string
          - type: 'null'
        createdAt:
          type: string
          format: date-time
    VerifiedMatchSnapshot:
      type: object
      additionalProperties: false
      required:
      - contractVersion
      - schemaVersion
      - engineVersion
      - bundleId
      - snapshotSchemaVersion
      - checksumSerialization
      - checksumSha256
      - matchId
      - teamId
      - seasonId
      - deviceId
      - state
      - acceptedRevision
      - deviceCheckpoint
      - controller
      - publication
      - acceptedEvents
      - controllerTransitions
      - downloadedAt
      - clockAnchor
      - syntheticOnly
      properties:
        contractVersion:
          const: longball.events/1.1
        schemaVersion:
          const: 1
        engineVersion:
          const: synthetic-live-4
        bundleId:
          $ref: '#/components/schemas/Identifier'
        snapshotSchemaVersion:
          const: 1
        checksumSerialization:
          const: longball.canonical-json/1
        checksumSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        matchId:
          $ref: '#/components/schemas/Identifier'
        teamId:
          $ref: '#/components/schemas/Identifier'
        seasonId:
          $ref: '#/components/schemas/Identifier'
        deviceId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,120}$
        state:
          $ref: '#/components/schemas/OfflineMatchProjection'
        acceptedRevision:
          type: integer
          minimum: 0
        deviceCheckpoint:
          type: object
          additionalProperties: false
          required:
          - clientSequence
          - previousEventId
          properties:
            clientSequence:
              type: integer
              minimum: 0
            previousEventId:
              anyOf:
              - $ref: '#/components/schemas/Identifier'
              - type: 'null'
        controller:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - epoch
            - account_id
            - device_id
            - frozen
            properties:
              epoch:
                type: integer
                minimum: 1
              account_id:
                $ref: '#/components/schemas/Identifier'
              device_id:
                $ref: '#/components/schemas/Identifier'
              frozen:
                enum:
                - 0
                - 1
          - type: 'null'
        publication:
          $ref: '#/components/schemas/OfflinePublication'
        acceptedEvents:
          type: array
          items:
            $ref: '#/components/schemas/OfflineAcceptedRecord'
          maxItems: 10000
        controllerTransitions:
          type: array
          items:
            $ref: '#/components/schemas/OfflineControllerTransition'
          maxItems: 10000
        downloadedAt:
          type: string
          format: date-time
        clockAnchor:
          type: object
          additionalProperties: false
          required:
          - serverTime
          - quality
          - continuousMappingEstablished
          properties:
            serverTime:
              type: string
              format: date-time
            quality:
              const: observation_only
            continuousMappingEstablished:
              const: false
        syntheticOnly:
          type: boolean
    CurrentMatchPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      - serverTime
      properties:
        items:
          type: array
          items:
            type: object
          maxItems: 100
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        serverTime:
          type: string
          format: date-time
      description: Each item is the existing audience-filtered match DTO; raw manager state is never sent for player/spectator
        audiences.
    PushRegistrationInput:
      type: object
      additionalProperties: false
      required: [deviceId, platform, transport, token, appBuild, permission]
      properties:
        deviceId: {type: string, pattern: '^[A-Za-z0-9_-]{1,120}$'}
        platform: {enum: [ios, android]}
        transport: {enum: [apns, fcm, expo]}
        token: {type: string, minLength: 20, maxLength: 4096, not: {pattern: '[\s\x00-\x1f\x7f]'}, writeOnly: true}
        appBuild: {type: string, maxLength: 60, not: {pattern: '[\x00-\x1f\x7f]'}}
        permission: {enum: [granted, provisional, denied]}
      description: Canonical push registration fields. Denied is parseable but registration returns409; use DELETE to withdraw. Platform/transport must match current enrollment and operator configuration.
    PushApnsPolicy:
      type: object
      additionalProperties: false
      required: [transport, providerConfigId]
      properties:
        transport: {const: apns}
        providerConfigId: {$ref: '#/components/schemas/Identifier'}
    PushFcmPolicy:
      type: object
      additionalProperties: false
      required: [transport, providerConfigId]
      properties:
        transport: {const: fcm}
        providerConfigId: {$ref: '#/components/schemas/Identifier'}
    PushExpoPolicy:
      type: object
      additionalProperties: false
      required: [transport, providerConfigId, projectId]
      properties:
        transport: {const: expo}
        providerConfigId: {$ref: '#/components/schemas/Identifier'}
        projectId: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'}
    PushDeviceStatus:
      type: object
      additionalProperties: false
      required: [deviceId, platform, transport, permission, state, revision, appBuild, registeredAt, updatedAt, revokedAt, lastOperationId]
      properties:
        deviceId: {$ref: '#/components/schemas/Identifier'}
        platform: {enum: [ios, android]}
        transport: {enum: [apns, fcm, expo, null]}
        permission: {enum: [granted, provisional, denied]}
        state: {enum: [registered, revoked]}
        revision: {type: integer, minimum: 1, maximum: 9007199254740991}
        appBuild: {type: string, maxLength: 60}
        registeredAt: {type: [string, 'null'], format: date-time}
        updatedAt: {type: string, format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
        lastOperationId: {$ref: '#/components/schemas/Identifier'}
      allOf:
        - if: {properties: {state: {const: registered}}}
          then:
            properties:
              transport: {enum: [apns, fcm, expo]}
              permission: {enum: [granted, provisional]}
              registeredAt: {type: string}
              revokedAt: {type: 'null'}
        - if: {properties: {state: {const: revoked}}}
          then:
            properties:
              permission: {const: denied}
              revokedAt: {type: string}
    AccountPushStatus:
      type: object
      additionalProperties: false
      required: [accountId, registrationConfigured, deliveryConfigured, platforms, devices]
      properties:
        accountId: {$ref: '#/components/schemas/Identifier'}
        registrationConfigured: {type: boolean}
        deliveryConfigured: {type: boolean}
        platforms:
          type: object
          additionalProperties: false
          properties:
            ios: {oneOf: [{$ref: '#/components/schemas/PushApnsPolicy'}, {$ref: '#/components/schemas/PushExpoPolicy'}]}
            android: {oneOf: [{$ref: '#/components/schemas/PushFcmPolicy'}, {$ref: '#/components/schemas/PushExpoPolicy'}]}
        devices:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: {$ref: '#/components/schemas/PushDeviceStatus'}
      description: Device IDs are unique within the own-account response. Tokens, token hashes, ciphertext and private provider credentials are excluded.
    PushRegistrationMutationResult:
      type: object
      additionalProperties: false
      required: [id, revision, serverTime]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        revision: {type: integer, minimum: 1, maximum: 9007199254740991}
        serverTime: {type: string, format: date-time}
    PushRegistrationWithdrawalAccepted:
      type: object
      additionalProperties: false
      required: [operationId, status, serverTime]
      properties:
        operationId: {$ref: '#/components/schemas/Identifier'}
        status: {const: completed}
        serverTime: {type: string, format: date-time}
    OwnTeamPrivileges:
      type: object
      additionalProperties: false
      required: [kind, teamId, seasonId, uploadsAllowed, invitationsAllowed]
      properties:
        kind: {const: own-team-privileges}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        uploadsAllowed: {type: boolean}
        invitationsAllowed: {type: boolean}
    TeamPrivilegesView:
      type: object
      additionalProperties: false
      required: [kind, teamId, seasonId, revision, own, targets]
      properties:
        kind: {const: team-privileges}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        revision: {type: integer, minimum: 0, maximum: 9007199254740991}
        own: {$ref: '#/components/schemas/OwnTeamPrivileges'}
        targets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [accountId, label, uploadsSuspended, invitationsSuspended]
            properties:
              accountId: {$ref: '#/components/schemas/Identifier'}
              label: {type: string, maxLength: 300}
              uploadsSuspended: {type: boolean}
              invitationsSuspended: {type: boolean}
    TeamPrivilegeRequest:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command:
          type: object
          additionalProperties: false
          required: [id, type, expectedRevision, targetAccountId, privilege, reasonCode, confirm]
          properties:
            id: {$ref: '#/components/schemas/Identifier'}
            type: {enum: [privilege.suspended, privilege.reinstated]}
            expectedRevision: {type: integer, minimum: 0, maximum: 9007199254740991}
            targetAccountId: {$ref: '#/components/schemas/Identifier'}
            privilege: {enum: [uploads, invitations]}
            reasonCode: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$'}
            privateNote: {type: [string, 'null'], maxLength: 1000, pattern: '^[^\x00-\x08\x0b\x0c\x0e-\x1f\x7f]*$'}
            confirm: {const: true}
    TeamPrivilegeReceipt:
      type: object
      additionalProperties: false
      required: [kind, commandId, teamId, revision]
      properties:
        kind: {const: team-privilege-receipt}
        commandId: {$ref: '#/components/schemas/Identifier'}
        teamId: {$ref: '#/components/schemas/Identifier'}
        revision: {type: integer, minimum: 1, maximum: 9007199254740991}
    MatchClockSample:
      type: object
      additionalProperties: false
      required:
      - monotonicMs
      - sessionId
      - wallTimeMs
      properties:
        monotonicMs:
          type: number
          minimum: 0
        sessionId: &id002
          $ref: '#/components/schemas/Identifier'
        wallTimeMs: &id001
          type: integer
          minimum: 0
    PolicyEffectiveTime:
      type: object
      additionalProperties: false
      required:
      - half
      - halfElapsedMs
      - matchElapsedMs
      properties:
        half:
          type: integer
          enum:
          - 0
          - 1
          - 2
        halfElapsedMs: *id001
        matchElapsedMs: *id001
    ProspectivePolicyPayload:
      type: object
      additionalProperties: false
      required:
      - keeperMode
      - fixedKeeperPlayerSeasonId
      - minimumStintMs
      - batchLimit
      - scoreLeadThreshold
      - returnToNormalEnabled
      properties:
        keeperMode:
          enum:
          - sole_fixed
          - common_pool
        fixedKeeperPlayerSeasonId: &id004
          anyOf:
          - *id002
          - type: 'null'
        minimumStintMs: *id001
        batchLimit:
          type: integer
          minimum: 1
          maximum: 11
        scoreLeadThreshold: &id003
          type: integer
          minimum: 1
        returnToNormalEnabled:
          type: boolean
      description: Supplied canonical PolicyPayload fields. Minimum stint and batch remain explicitly soft runtime preferences.
        A keeper transition is refused while Q07 is unapproved.
    PolicyApplicability:
      type: object
      additionalProperties: false
      required:
      - minimumStint
      - batchLimit
      - q07
      properties:
        minimumStint:
          const: soft_preference
        batchLimit:
          const: soft_preference
        q07:
          const: unapproved
    PolicySoftPreferences:
      type: object
      additionalProperties: false
      required:
      - halfBufferFraction
      properties:
        halfBufferFraction:
          type: number
          minimum: 0
          maximum: 0.49
    PolicyChangeCommand:
      type: object
      additionalProperties: false
      required:
      - id
      - sample
      - type
      - policySchemaVersion
      - policyVersion
      - previousPolicyVersion
      - sourceRevision
      - effective
      - reason
      - payload
      - applicability
      - softPreferences
      properties:
        id: *id002
        sample:
          $ref: '#/components/schemas/MatchClockSample'
        type:
          const: policy.changed
        policySchemaVersion:
          const: 1
        policyVersion: *id003
        previousPolicyVersion: *id001
        sourceRevision: *id001
        effective:
          $ref: '#/components/schemas/PolicyEffectiveTime'
        reason:
          type: string
          minLength: 5
          maxLength: 500
          pattern: \S[\s\S]{3,}\S
        payload:
          $ref: '#/components/schemas/ProspectivePolicyPayload'
        applicability:
          $ref: '#/components/schemas/PolicyApplicability'
        softPreferences:
          $ref: '#/components/schemas/PolicySoftPreferences'
        resetPositionMode:
          type: boolean
        actorId:
          type: string
          description: Rebound by the authenticated service; a caller value confers no authority.
      description: Exact source revision, prior/new version chain and current continuous effective boundary must be
        validated together. Preparation uses half0 and zero active time. No committed history, attendance or player
        allocation is rewritten.
    OtherMatchCommand:
      type: object
      required:
      - id
      - type
      - sample
      properties:
        id: *id002
        sample:
          $ref: '#/components/schemas/MatchClockSample'
        type:
          enum:
          - attendance.recorded
          - availability.changed
          - lineup.staged
          - half.started
          - half.paused
          - half.resumed
          - half.ended
          - lineup.committed
          - goal.recorded
          - clock.recovery_required
          - clock.corrected
          - event.corrected
          - event.voided
          - match.abandoned
      description: Other engine4 command fields remain validated by the strict deterministic reducer and companion events-v1.1
        transport schema.
    MatchCommandEnvelope:
      type: object
      additionalProperties: false
      required:
      - contractVersion
      - schemaVersion
      - engineVersion
      - eventId
      - matchId
      - deviceId
      - controllerEpoch
      - clientSequence
      - previousEventId
      - baseRevision
      - effectiveHalf
      - halfElapsedMs
      - matchElapsedMs
      - effectiveAt
      - recordedAt
      - timeQuality
      - clockEvidence
      - command
      properties:
        contractVersion:
          const: longball.events/1.1
        schemaVersion:
          const: 1
        engineVersion:
          const: synthetic-live-4
        eventId: *id002
        matchId: *id002
        deviceId:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,120}$'
        controllerEpoch: *id003
        clientSequence: *id003
        previousEventId: *id004
        baseRevision: *id001
        effectiveHalf:
          type: integer
          enum:
          - 0
          - 1
          - 2
        halfElapsedMs: *id001
        matchElapsedMs: *id001
        effectiveAt:
          type:
          - string
          - 'null'
          format: date-time
        recordedAt:
          type: string
          format: date-time
        timeQuality:
          enum:
          - anchored
          - estimated
          - reviewRequired
        clockEvidence:
          type: object
          additionalProperties: false
          required:
          - monotonicMs
          - anchorId
          - continuityId
          properties:
            monotonicMs:
              type: number
              minimum: 0
            anchorId: *id002
            continuityId: *id004
        command:
          oneOf:
          - $ref: '#/components/schemas/PolicyChangeCommand'
          - $ref: '#/components/schemas/OtherMatchCommand'
    MatchUploadReceipt:
      type: object
      additionalProperties: false
      required:
      - results
      - revision
      - pendingReview
      properties:
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - eventId
            - clientSequence
            - disposition
            - reason
            - revision
            - duplicate
            properties:
              eventId: *id002
              clientSequence: *id003
              disposition:
                enum:
                - accepted
                - quarantined
              reason:
                type:
                - string
                - 'null'
              revision:
                type:
                - integer
                - 'null'
                minimum: 0
              duplicate:
                type: boolean
        revision: *id001
        pendingReview:
          type: boolean
    InvitationToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
      writeOnly: true
    InvitationTokenInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {$ref: '#/components/schemas/InvitationToken'}
    InvitationWrite:
      type: object
      additionalProperties: false
      required: [seasonId, expiresInHours]
      properties:
        seasonId: {$ref: '#/components/schemas/Identifier'}
        expiresInHours: {type: integer, minimum: 1, maximum: 48}
      description: Runtime requires explicit expiry unless an operator has explicitly configured a default. No caller credential or verifier is accepted.
    InvitationCreated:
      type: object
      additionalProperties: false
      required: [id, shareUrl, expiresAt, teamId, seasonId]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        shareUrl: {type: string, format: uri, description: One-time secret; never log, publish or persist it}
        expiresAt: {type: string, format: date-time}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
    RedactedInvitationReceipt:
      type: object
      additionalProperties: false
      required: [id, expiresAt, teamId, seasonId, credentialAvailable, requiresReissue]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        expiresAt: {type: string, format: date-time}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        credentialAvailable: {const: false}
        requiresReissue: {const: true}
    InvitationDestination:
      type: object
      additionalProperties: false
      required: [invitationId, teamId, seasonId, expiresAt]
      properties:
        invitationId: {$ref: '#/components/schemas/Identifier'}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        expiresAt: {type: string, format: date-time}
    InvitationContext:
      type: object
      additionalProperties: false
      required: [clubName, teamName, ageGroup, seasonLabel, inviterLabel]
      properties:
        clubName: {type: string, minLength: 1, maxLength: 150}
        teamName: {type: string, minLength: 1, maxLength: 150}
        ageGroup: {type: [string, 'null'], minLength: 1, maxLength: 150}
        seasonLabel: {type: [string, 'null'], minLength: 1, maxLength: 150}
        inviterLabel: {type: string, enum: [Team manager, Team member]}
      description: Display metadata only from the exact current server-validated invitation scope. Role-only inviter label exposes no person's identity and grants no authority.
    InvitationInspection:
      type: object
      additionalProperties: false
      required: [invitationId, teamId, seasonId, expiresAt, context]
      properties:
        invitationId: {$ref: '#/components/schemas/Identifier'}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        expiresAt: {type: string, format: date-time}
        context: {$ref: '#/components/schemas/InvitationContext'}
    InvitationList:
      type: object
      additionalProperties: false
      required: [kind, teamId, seasonId, revision, invitations]
      properties:
        kind: {const: spectator-invitations}
        teamId: {$ref: '#/components/schemas/Identifier'}
        seasonId: {$ref: '#/components/schemas/Identifier'}
        revision: {type: integer, minimum: 0}
        invitations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, teamId, seasonId, expiresAt, status, canReissue, canRevoke]
            properties:
              id: {$ref: '#/components/schemas/Identifier'}
              teamId: {$ref: '#/components/schemas/Identifier'}
              seasonId: {$ref: '#/components/schemas/Identifier'}
              expiresAt: {type: string, format: date-time}
              status: {enum: [pending, accepted, revoked, expired, requires_reissue]}
              canReissue: {type: boolean}
              canRevoke: {type: boolean}
    NativeDeviceInput:
      type: object
      additionalProperties: false
      required: [deviceId, platform]
      properties:
        deviceId: {type: string, minLength: 1, maxLength: 120, pattern: '^[A-Za-z0-9_-]+$'}
        platform: {enum: [ios, android]}
    RecognisedDevices:
      type: object
      additionalProperties: false
      required: [kind, accountId, asOf, devices, remoteRevocationAvailable]
      properties:
        kind: {const: recognised-devices}
        accountId: {$ref: '#/components/schemas/Identifier'}
        asOf: {type: string, format: date-time}
        remoteRevocationAvailable: {const: false}
        devices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [deviceId, source, label, platform, platformVerified, registeredAt, lastSeenAt]
            properties:
              deviceId: {$ref: '#/components/schemas/Identifier'}
              source: {enum: [native_app_enrolment, match_controller_enrolment]}
              label: {type: 'null'}
              platform: {enum: [ios, android, null]}
              platformVerified: {const: false}
              registeredAt: {type: [string, 'null'], format: date-time}
              lastSeenAt: {type: [string, 'null'], format: date-time}
    Identifier: {type: string, pattern: '^[A-Za-z0-9_-]{1,150}$'}
    StaffCommand:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, id, expectedRevision, accountId]
              properties:
                type: {const: manager.assigned}
                id: {$ref: '#/components/schemas/Identifier'}
                expectedRevision: {type: integer, minimum: 0}
                accountId: {$ref: '#/components/schemas/Identifier'}
            - type: object
              additionalProperties: false
              required: [type, id, expectedRevision, accountId, reason, confirmRevocation]
              properties:
                type: {const: manager.revoked}
                id: {$ref: '#/components/schemas/Identifier'}
                expectedRevision: {type: integer, minimum: 0}
                accountId: {$ref: '#/components/schemas/Identifier'}
                reason: {type: string, minLength: 1}
                confirmRevocation: {const: true}
    PreparedLogoUpload:
      type: object
      additionalProperties: false
      required: [kind, uploadId, asset, uploadToken, expiresAtMs, maxBytes]
      properties:
        kind: {const: prepared-logo-upload}
        uploadId: {$ref: '#/components/schemas/Identifier'}
        asset: {$ref: '#/components/schemas/BrandReference'}
        uploadToken: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$', description: 'Private bounded upload capability; keep only in memory and never use for reading'}
        expiresAtMs: {type: integer, minimum: 0}
        maxBytes: {const: 15728640}
    UploadedLogoReceipt:
      type: object
      additionalProperties: false
      required: [uploadId, status, byteSize]
      properties:
        uploadId: {$ref: '#/components/schemas/Identifier'}
        status: {const: uploaded}
        byteSize: {type: integer, minimum: 1, maximum: 15728640}
    ProcessedLogoUpload:
      type: object
      additionalProperties: false
      required: [kind, uploadId, asset, status, width, height]
      properties:
        kind: {const: processed-logo-upload}
        uploadId: {$ref: '#/components/schemas/Identifier'}
        asset: {$ref: '#/components/schemas/BrandReference'}
        status: {const: processed}
        width: {type: integer, minimum: 1, maximum: 1024}
        height: {type: integer, minimum: 1, maximum: 1024}
    BrandingCommandReceipt:
      type: object
      additionalProperties: false
      required: [kind, commandId, revision, acceptedAt, branding]
      properties:
        kind: {const: branding-command-receipt}
        commandId: {$ref: '#/components/schemas/Identifier'}
        revision: {type: integer, minimum: 1}
        acceptedAt: {type: string, format: date-time}
        branding: {$ref: '#/components/schemas/BrandingDto'}
    BrandReference:
      type: object
      additionalProperties: false
      required: [assetId, revision, kind, clubId, teamId]
      properties:
        assetId: {$ref: '#/components/schemas/Identifier'}
        revision: {type: integer, minimum: 1}
        kind: {enum: [club_logo, team_logo]}
        clubId: {$ref: '#/components/schemas/Identifier'}
        teamId: {oneOf: [{$ref: '#/components/schemas/Identifier'}, {type: 'null'}]}
      oneOf:
        - properties: {kind: {const: club_logo}, teamId: {type: 'null'}}
        - properties: {kind: {const: team_logo}, teamId: {$ref: '#/components/schemas/Identifier'}}
    LogoPrepareInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, clubId, byteSize, mimeType, sha256, policyAcknowledged]
          properties:
            kind: {const: club_logo}
            clubId: {$ref: '#/components/schemas/Identifier'}
            byteSize: {type: integer, minimum: 1, maximum: 15728640}
            mimeType: {enum: [image/jpeg, image/png, image/heic]}
            sha256: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
            policyAcknowledged: {const: true}
        - type: object
          additionalProperties: false
          required: [kind, teamId, byteSize, mimeType, sha256, policyAcknowledged]
          properties:
            kind: {const: team_logo}
            teamId: {$ref: '#/components/schemas/Identifier'}
            byteSize: {type: integer, minimum: 1, maximum: 15728640}
            mimeType: {enum: [image/jpeg, image/png, image/heic]}
            sha256: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
            policyAcknowledged: {const: true}
    BrandPublishRequest:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command:
          type: object
          additionalProperties: false
          required: [id, type, kind, expectedSlotVersion, assetId, reviewedRevision, confirmRightsToUse, policyVersion]
          properties:
            id: {$ref: '#/components/schemas/Identifier'}
            type: {const: logo.published}
            kind: {enum: [club_logo, team_logo]}
            expectedSlotVersion: {type: integer, minimum: 0}
            assetId: {$ref: '#/components/schemas/Identifier'}
            reviewedRevision: {type: integer, minimum: 1}
            confirmRightsToUse: {const: true}
            policyVersion: {type: string, minLength: 1, maxLength: 150}
    BrandRemoveRequest:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command:
          type: object
          additionalProperties: false
          required: [id, type, kind, expectedSlotVersion]
          properties:
            id: {$ref: '#/components/schemas/Identifier'}
            type: {const: logo.removed}
            kind: {enum: [club_logo, team_logo]}
            expectedSlotVersion: {type: integer, minimum: 0}
    BrandingDto:
      type: object
      additionalProperties: false
      required: [kind, teamId, clubId, authoritySeasonId, policyVersion, club, team, effective, canWriteClub, canWriteTeam, assets]
      properties:
        kind: {const: team-branding}
        teamId: {$ref: '#/components/schemas/Identifier'}
        clubId: {$ref: '#/components/schemas/Identifier'}
        authoritySeasonId: {$ref: '#/components/schemas/Identifier'}
        policyVersion: {type: string}
        club:
          type: object
          additionalProperties: false
          required: [id, name, slotVersion, logo]
          properties:
            id: {$ref: '#/components/schemas/Identifier'}
            name: {type: string}
            slotVersion: {type: integer, minimum: 0}
            logo: {oneOf: [{$ref: '#/components/schemas/BrandReference'}, {type: 'null'}]}
        team:
          type: object
          additionalProperties: false
          required: [id, name, ageGroup, slotVersion, logo]
          properties:
            id: {$ref: '#/components/schemas/Identifier'}
            name: {type: string}
            ageGroup: {type: string}
            slotVersion: {type: integer, minimum: 0}
            logo: {oneOf: [{$ref: '#/components/schemas/BrandReference'}, {type: 'null'}]}
        effective:
          type: object
          additionalProperties: false
          required: [source, logo]
          properties:
            source: {enum: [team, club, neutral]}
            logo: {oneOf: [{$ref: '#/components/schemas/BrandReference'}, {type: 'null'}]}
        canWriteClub: {type: boolean}
        canWriteTeam: {type: boolean}
        assets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [assetId, revision, kind, clubId, teamId, status, byteSize, width, height, createdAt, processedAt]
            properties:
              assetId: {$ref: '#/components/schemas/Identifier'}
              revision: {type: integer, minimum: 1}
              kind: {enum: [club_logo, team_logo]}
              clubId: {$ref: '#/components/schemas/Identifier'}
              teamId: {oneOf: [{$ref: '#/components/schemas/Identifier'}, {type: 'null'}]}
              status: {enum: [prepared, uploaded, processing, processed, published, rejected]}
              byteSize: {type: integer, minimum: 1, maximum: 15728640}
              width: {type: [integer, 'null'], minimum: 1}
              height: {type: [integer, 'null'], minimum: 1}
              createdAt: {type: integer, minimum: 0}
              processedAt: {type: [integer, 'null'], minimum: 0}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
  parameters:
    ReportExportId: {name: exportId, in: path, required: true, schema: {type: string, format: uuid}}
    PushDeviceId: {name: deviceId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,120}$'}}
    PushIfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"(?:0|[1-9][0-9]{0,14})"(?![\s\S])'}
      description: Exact quoted current push-device revision. Send '"0"' for an absent registration; no wildcard, weak ETag, list, unquoted number or leading zero is accepted.
      example: '"0"'
    BrandWriteRole: {name: X-Longball-Role, in: header, required: true, schema: {enum: [administrator, manager]}, description: 'Choose the explicit current kind authority: administrator for club_logo or assigned manager for team_logo'}
    InvitationId: {name: invitationId, in: path, required: true, schema: {$ref: '#/components/schemas/Identifier'}}
    BrandKind: {name: kind, in: path, required: true, schema: {enum: [club_logo, team_logo]}}
    BrandUploadId: {name: uploadId, in: path, required: true, schema: {$ref: '#/components/schemas/Identifier'}}
    BrandUploadToken: {name: X-Media-Upload-Token, in: header, required: true, schema: {type: string, writeOnly: true}}
    MatchId: {name: matchId, in: path, required: true, schema: {$ref: '#/components/schemas/Identifier'}}
    TeamId: {name: teamId, in: path, required: true, schema: {$ref: '#/components/schemas/Identifier'}}
    SeasonId: {name: seasonId, in: query, required: true, schema: {$ref: '#/components/schemas/Identifier'}}
    SelectedRole: {name: X-Longball-Role, in: header, schema: {enum: [administrator, manager, player, spectator]}}
    ContractVersion: {name: X-Api-Contract-Version, in: header, required: true, schema: {const: longball.events/1.1}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{8,150}$'}}
    ControllerToken: {name: X-Controller-Token, in: header, required: true, schema: {type: string}}
  responses:
    BadRequest:
      description: Invalid exact body, quoted revision, command identity or stable idempotency key
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthenticated:
      description: An active verified account/session is required
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PushConflict:
      description: PUSH_REGISTRATION_CHANGED, PUSH_PROCESSOR_UNAVAILABLE, PUSH_PERMISSION_DENIED, contract-version mismatch or idempotency key reused with different body/revision; refresh metadata and preserve uncertain requests
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PushRevisionRequired:
      description: PUSH_REVISION_REQUIRED; read own status and send the exact quoted If-Match revision, including zero when absent
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PushConfigurationRequired:
      description: PUSH_NOT_CONFIGURED; registration needs explicitly selected platform policy and deployment encryption keys
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AdultAuthorityRequired:
      description: ADULT_AUTHORITY_REQUIRED; the selected manager account must have current adult verification and stronger authentication
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    TeamPrivilegeConflict:
      description: TEAM_PRIVILEGE_REVISION_CONFLICT, TEAM_PRIVILEGE_ALREADY_SET, reconciliation required, contract-version mismatch or idempotency conflict; refresh the current team-wide decision before a new command
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    TeamPrivilegesUnavailable:
      description: TEAM_PRIVILEGES_UNAVAILABLE; the service cannot establish current contribution permission
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Current revision, controller authority, challenge validity or exact request differs; retain uncertain local work
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PolicyRequired:
      description: An explicit operator policy is absent; implementation does not approve it
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: Current identity, membership or object scope does not permit this resource
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
