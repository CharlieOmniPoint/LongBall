      responses:
        '200': {description: Retained acknowledgement and current metadata-only schedule, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduledGameManagement'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Conflict'}
  /teams/{teamId}/player-stats:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
      - {$ref: '#/components/parameters/SeasonId'}
      - {name: X-Longball-Role, in: header, required: true, schema: {enum: [manager, administrator, player]}}
    get:
      operationId: readScopedPlayerStatistics
      summary: Read staff aggregates or only the currently linked player's aggregates
      description: Spectators are denied. Administrators use a narrow database projection; existing private records, preparation and feedback access is not widened. Clean sheets require completed accepted active goalkeeper intervals and explicit opposition goal timings; unknown or ambiguous history is never inferred from a zero final score. Accepted checkpoints override older archived revisions once per game. Unknown or reviewed detail stays explicit; no scheduled duration becomes actual participation. No attendance, RSVP, injury, preferences or private feedback is returned.
      responses:
        '200': {description: Exact own-player or team aggregate projection, content: {application/json: {schema: {$ref: '#/components/schemas/PlayerStatistics'}}}}
        '404': {$ref: '#/components/responses/Unavailable'}
  /teams/{teamId}/match-feedback:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
      - {$ref: '#/components/parameters/SeasonId'}
      - {name: X-Longball-Role, in: header, required: true, schema: {enum: [manager, player]}}
    get:
      operationId: readPrivatePostGameFeedback
      summary: Read own private feedback or assigned-manager feedback
      description: Other players never receive another child's notes. Administrators and spectators are denied. Private feedback uses separate storage and is absent from team statistics, community and report exports.
      responses:
        '200': {description: Current private feedback and authoritative edit-window status, content: {application/json: {schema: {$ref: '#/components/schemas/PrivateMatchFeedback'}}}}
        '404': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: saveOwnPrivatePostGameFeedback
      summary: Save the current linked player's rating and optional note
      description: Requires positive accepted participation and a verified original completion. Editing closes exclusively at midnight Europe/London on that completion day, including DST. Receipt replay does not submit a new edit or extend the original window. The durable command ID must equal Idempotency-Key; submitted player/account IDs are rejected.
      parameters:
        - {name: X-Longball-Role, in: header, required: true, schema: {const: player}}
        - {$ref: '#/components/parameters/ContractVersion'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [command], properties: {command: {$ref: '#/components/schemas/PrivateMatchFeedbackCommand'}}}}}
      responses:
        '200': {description: Durable actor-bound feedback receipt, content: {application/json: {schema: {$ref: '#/components/schemas/PrivateMatchFeedbackReceipt'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Conflict'}
  /teams/{teamId}/team-overview:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
      - {$ref: '#/components/parameters/SeasonId'}
      - {name: X-Longball-Role, in: header, required: true, schema: {enum: [manager, administrator, player, spectator]}}
    get:
      operationId: readCurrentPublicTeamOverview
      summary: Read current team and safe fixture metadata for all assigned roles
      description: Spectator access requires a current live grant. Includes saved unprepared fixtures; accepted match status overrides scheduled metadata without overriding explicit cancellation/postponement. Deleted tombstones are excluded. No roster, score, attendance, replies, feedback or raw preparation documents are returned.
      responses:
        '200': {description: Current safe team metadata, content: {application/json: {schema: {$ref: '#/components/schemas/TeamOverview'}}}}
        '404': {$ref: '#/components/responses/Unavailable'}

  /sign-in-rules:
    get:
      operationId: readApplicationSignInRules
      summary: Read the application-wide rules for choosing new usernames and credentials
      security: []
      description: >-
        Public, non-personal policy metadata for account entry. Returns no account names,
        credentials, verifiers, membership information or username-availability directory.
        Rules govern newly chosen usernames, passwords and spectator passcodes across the
        application; existing logins retain their established credentials. Spectator PINs
        remain exactly four digits and never grant Player or staff authority. Password
        enforcement depends on the explicitly reported configured-provider status.
      responses:
        '200':
          description: Current rules and provider confirmation state; private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRulesDto'
        '503':
          description: SIGN_IN_RULES_UNAVAILABLE; current persisted rules could not be established
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /administration/sign-in-rules:
    get:
      operationId: readAdministrativeSignInRules
      summary: Read sign-in rules as a currently authorized Super Admin
      description: >-
        Rechecks the server-owned Super Admin grant, active verified adult identity and
        recent stronger authentication. Club Admin, Manager, Player and Spectator roles
        cannot obtain this administrative view by supplying a role header. The DTO contains
        the same non-personal rule metadata available to account entry.
      responses:
        '200':
          description: Current authorized rules; private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRulesDto'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: ADULT_AUTHORITY_REQUIRED or RECENT_AUTHENTICATION_REQUIRED
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404': {$ref: '#/components/responses/Unavailable'}
        '503':
          description: SIGN_IN_RULES_UNAVAILABLE; current persisted rules could not be established
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    post:
      operationId: saveApplicationSignInRules
      summary: Save the application-wide rules as a Super Admin
      description: >-
        Requires a current Super Admin grant and recent stronger verified-adult
        authentication, checked again before replaying an idempotent receipt. Supply the
        reviewed expectedRevision, including zero for the initial rules. A stale revision
        is rejected. The exact request uses a stable Idempotency-Key; different content
        with the same key is rejected. A configured password provider must confirm the
        requested revision before the application commits it; unavailable or unsupported
        enforcement fails closed. With no provider configured, new spectator registration
        uses the saved username/PIN rules and provider status remains not_configured.
        Existing accounts, configured demo credentials and current sessions are not renamed,
        reset, revoked or revalidated against newly selected creation rules. Four-digit
        spectator PINs remain separate from Player and staff password credentials.
      parameters:
      - $ref: '#/components/parameters/ContractVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRulesInput'
      responses:
        '200':
          description: Saved revision and current provider state; private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRulesDto'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: ADULT_AUTHORITY_REQUIRED or RECENT_AUTHENTICATION_REQUIRED
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409':
          description: SIGN_IN_RULES_CONFLICT, contract-version mismatch or idempotency key reused with different content
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '415':
          description: JSON_REQUIRED; use application/json
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503':
          description: SIGN_IN_RULES_UNAVAILABLE or SIGN_IN_RULES_PROVIDER_UNAVAILABLE; no application rule revision was committed
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /administration/login-analytics:
    get:
      operationId: readSuperAdminLoginAnalytics
      summary: Read private application login and activity reports as a Super Admin
      description: >-
        Rechecks the current server-owned Super Admin grant, active verified adult
        identity and current stronger authentication. This read-only report does not add
        a five-minute authentication-age requirement; existing privileged writes keep
        their separate recent-authentication requirements. Club Admin, Manager, Player and
        Spectator accounts cannot obtain this report through role headers or filters.
        Filters select a report view and never grant authority. Unknown or repeated
        query fields are rejected. Reads return private, no-store data with a maximum
        of 50 events per cursor page; aggregate event collection is explicitly bounded.
        Event pagination freezes eventAsOf and a persisted event-ordinal high-water mark
        while observedAt continues to describe current activity observations. Later inserts,
        including same-timestamp or backdated observations, are excluded from that event page
        sequence. Returned cursors bind normalized filters, expire after one hour and are
        never authority tokens.
        Active accounts means authenticated application API activity within 15 minutes,
        including foreground polling, not a proof of online presence. Global unique
        accounts are distinct; club/team and role breakdowns can overlap and need not
        sum to the global total. Scope attribution follows recorded server observations,
        not a client-supplied club/team assertion. Failed credentials without an accepted
        account are unattributed. Upstream OIDC password failures are not observable;
        OIDC sign-in observations mean verified use of the application. The report does
        not fabricate activity before collection began and does not choose a production
        privacy-retention period. No password, passcode, bearer/session token, verifier,
        raw submitted unknown username, IP address or user-agent fingerprint is returned.
      parameters:
      - name: range
        in: query
        required: false
        schema: {type: string, enum: [24h, 7d, 30d], default: 7d}
        description: Bounded report window ending at the response observation time.
      - name: clubId
        in: query
        required: false
        schema: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
        description: Club filter; unknown or contradictory scope is unavailable.
      - name: teamId
        in: query
        required: false
        schema: {$ref: '#/components/schemas/LoginAnalyticsIdentifier'}
        description: Team filter; it must belong to a supplied club filter.
      - name: role
        in: query
        required: false
        schema: {$ref: '#/components/schemas/LoginAnalyticsRole'}
        description: Observed account-type filter; it does not select authorization authority.
      - name: event
        in: query
        required: false
        schema: {$ref: '#/components/schemas/LoginAnalyticsEventType'}
      - name: cursor
        in: query
        required: false
        schema: {$ref: '#/components/schemas/LoginAnalyticsCursor'}
        description: Last event boundary for the same filters; not an authentication capability.
      responses:
        '200':
          description: Current authorized login/activity report; private, no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginAnalyticsDto'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: ADULT_AUTHORITY_REQUIRED; a current verified adult with stronger authentication is required
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404': {$ref: '#/components/responses/Unavailable'}
        '429':
          description: The ordinary authenticated request rate limit applies; retry later.
        '503':
          description: The persisted report cannot currently be established.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /administration:
