openapi: 3.1.0
info:
  title: LongBall mobile API draft
  version: 0.1.0
  description: Proposed contract, 20 October 2026. Not implemented. Servers use a deliberately non-resolving placeholder.
    Proposed typed product contracts cover identity, administration, match events and offline snapshots, publication
    policy, reports, awards, media, notifications, exports and scoped support. External policy and provider choices
    remain open. Validate against implemented behaviours before release.
servers:
- url: https://api.longball.invalid/v1
  description: Placeholder only, replace after domain and hosting decision
security:
- bearerAuth: []
paths:
  /accounts/activations:
    post:
      operationId: activateAccount
      summary: activateAccount
      description: Apply current server-side account, role and object-scope checks. See companion security and match-engine
        specifications. Competition/fixture publication policy is applied to all related results, aggregates, captions,
        exported rows, notifications and media context. Re-evaluate on policy/classification change; cached permissions
        or prior asset publication do not override it.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponse'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
