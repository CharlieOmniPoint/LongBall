components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token from the selected identity service. Native client uses authorisation code +
        PKCE S256.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id001
      description: Same key and canonical payload returns original response. Different payload for same key returns409.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Exact ETag/revision from the resource. Stale mutation returns409.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Error:
      description: Safe error envelope. HTTP status follows the API conventions in the security specification.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        requestId: *id001
        retryable: &id004
          type: boolean
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              code:
                type: string
            required:
            - field
            - code
        currentRevision:
          type: integer
          minimum: 0
        retryAfterSeconds:
          type: integer
          minimum: 0
      required:
      - code
      - message
      - requestId
      - retryable
    Accepted:
      type: object
      additionalProperties: false
      properties:
        operationId: *id001
        status:
          type: string
          enum:
          - accepted
          - pending
          - completed
        serverTime: &id002
          type: string
          format: date-time
      required:
      - operationId
      - status
      - serverTime
    MutationResult:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        revision:
          type: integer
          minimum: 1
        serverTime: *id002
      required:
      - id
      - revision
      - serverTime
    ActivationRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 22
          maxLength: 512
        deviceId: *id001
        policyVersion:
          type: string
      required:
      - token
      - deviceId
      - policyVersion
      description: One-time token, not a child email. Password setup takes place in the identity service required-action
        flow, never a plaintext API-managed password.
    ActivationResponse:
      type: object
      additionalProperties: false
      properties:
        accountId: *id001
        username:
          type: string
        identityActionUrl:
          type: string
          format: uri
        expiresAt: *id002
      required:
      - accountId
      - username
      - identityActionUrl
      - expiresAt
    RecoveryStart:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          maxLength: 64
        reason:
          type: string
          enum:
          - lost_device
          - forgotten_credential
          - compromised
          - other
        teamId:
          anyOf:
          - *id001
          - type: 'null'
      required:
      - username
      - reason
      description: Return a neutral accepted result regardless of whether the username exists. A manager can initiate
        only within their team but cannot discover other memberships.
    RecoveryVerify:
      type: object
      additionalProperties: false
      properties:
        recoveryCode:
          type: string
          minLength: 12
          maxLength: 256
        deviceId: *id001
      required:
      - recoveryCode
      - deviceId
    RecoveryDecision:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
        verificationMethod:
          type: string
          enum:
          - existing_recovery_code
          - verified_account_contact
          - operator_verified_household
        caseReference:
          type: string
          maxLength: 100
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - decision
      - verificationMethod
      - caseReference
      - reason
      description: Designated recovery administrator only with recent strong authentication. Evidence and authority
        policy are Q05 before live release.
    Device:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        platform:
          type: string
          enum:
          - ios
          - android
        label:
          type: string
          maxLength: 80
        lastSeenAt: *id002
        revokedAt:
          anyOf:
          - *id002
          - type: 'null'
      required:
      - id
      - platform
      - lastSeenAt
      - revokedAt
    Membership:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        clubId: *id001
        teamId: *id001
        teamName:
          type: string
        role:
          type: string
          enum:
          - player
          - manager
          - spectator
          - club_admin
        seasonId:
          anyOf:
          - *id001
          - type: 'null'
        expiresAt:
          anyOf:
          - *id002
          - type: 'null'
      required:
      - id
      - clubId
      - teamId
      - teamName
      - role
      - seasonId
      - expiresAt
    Me:
      type: object
      additionalProperties: false
      properties:
        accountId: *id001
        username:
          type: string
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        devices:
