name: longball-runtime
services:
  database:
    image: postgres@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    environment:
      POSTGRES_DB: longball
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    secrets: [postgres_password, migrator_password, api_password, worker_password]
    volumes:
      - database:/var/lib/postgresql
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/010-longball.sql:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d longball]
      interval: 5s
      timeout: 3s
      retries: 24
  scanner:
    image: clamav/clamav@sha256:e19130cdebaeacc71fa46eab3ed6f69941f2f22aa5e08d55e9197f8edf43ce5e
    entrypoint: [/usr/sbin/clamd, --config-file=/run/longball-clamd.conf, --foreground]
    read_only: true
    tmpfs: ["/tmp:rw,size=128m,mode=1777"]
    mem_limit: 2g
    cpus: 2
    volumes: [./clamd.conf:/run/longball-clamd.conf:ro]
    networks: [private]
    healthcheck:
      test: [CMD, clamdscan, --config-file=/run/longball-clamd.conf, --ping=1]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
  migrate:
    image: longball-runtime:local
    profiles: [migration]
    command: [node, backend/migrate.mjs]
    environment:
      LONGBALL_MIGRATION_DATABASE_URL_FILE: /run/secrets/migrator_url
      LONGBALL_MEDIA_DIRECTORY: /data/media
    secrets: [migrator_url]
    volumes: [objects:/data]
    read_only: true
    tmpfs: ["/tmp:rw,size=64m,mode=1777"]
    networks: [private]
    depends_on:
      database: {condition: service_healthy}
  api:
    image: longball-runtime:local
    environment:
      LONGBALL_DATABASE_URL_FILE: /run/secrets/api_url
      LONGBALL_API_HOST: 0.0.0.0
      LONGBALL_MEDIA_DIRECTORY: /data/media
      LONGBALL_CLAMD_HOST: scanner
      LONGBALL_CLAMD_PORT: "3310"
      LONGBALL_OIDC_ISSUER: ${LONGBALL_OIDC_ISSUER:-}
      LONGBALL_OIDC_AUDIENCE: ${LONGBALL_OIDC_AUDIENCE:-}
      LONGBALL_OIDC_JWKS_URI: ${LONGBALL_OIDC_JWKS_URI:-}
      LONGBALL_API_ORIGINS: ${LONGBALL_API_ORIGINS:-}
    secrets: [api_url]
    volumes: [objects:/data]
    ports: [127.0.0.1:4310:4310]
    read_only: true
    tmpfs: ["/tmp:rw,size=128m,mode=1777"]
    networks: [private, egress]
    depends_on:
      database: {condition: service_healthy}
  worker:
    image: longball-runtime:local
    command: [node, backend/worker.mjs]
    environment:
      LONGBALL_DATABASE_URL_FILE: /run/secrets/worker_url
    secrets: [worker_url]
    read_only: true
    tmpfs: ["/tmp:rw,size=64m,mode=1777"]
    networks: [private]
    depends_on:
      database: {condition: service_healthy}
  runtime-proof:
    image: longball-runtime:local
    profiles: [proof]
    command: [node, /app/worker-proof.mjs]
    environment:
      LONGBALL_RUNTIME_FIXTURE: "1"
      LONGBALL_DATABASE_URL_FILE: /run/secrets/api_url
      LONGBALL_WORKER_DATABASE_URL_FILE: /run/secrets/worker_url
    secrets: [api_url, worker_url]
    volumes: [../../.local/runtime/worker-proof.mjs:/app/worker-proof.mjs:ro]
    read_only: true
    tmpfs: ["/tmp:rw,size=64m,mode=1777"]
    networks: [private]
    depends_on:
      database: {condition: service_healthy}
networks:
  private: {internal: true}
  egress: {}
volumes:
  database: {}
  objects: {}
secrets:
  postgres_password: {file: ../../.local/runtime/deployment-secrets/postgres_password}
  migrator_password: {file: ../../.local/runtime/deployment-secrets/migrator_password}
  api_password: {file: ../../.local/runtime/deployment-secrets/api_password}
  worker_password: {file: ../../.local/runtime/deployment-secrets/worker_password}
  migrator_url: {file: ../../.local/runtime/deployment-secrets/migrator_url}
  api_url: {file: ../../.local/runtime/deployment-secrets/api_url}
  worker_url: {file: ../../.local/runtime/deployment-secrets/worker_url}
