name: LongBall PostgreSQL and scanner proof
# Optional future template: publish to .github/workflows only when the source
# commit is available in the public repository. No paid/private runners.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full reviewed source commit SHA to validate
        required: true
        type: string
permissions:
  contents: read
jobs:
  runtime:
    if: github.repository == 'CharlieOmniPoint/LongBall' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - name: Validate source selector
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: '[[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install pinned workspace dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile
      - name: Start disposable loopback runtimes
        run: bash infra/runtime/start.sh
      - name: Execute real media and paired restore proof
        run: |
          source .local/runtime/runtime.env
          node --import tsx scripts/runtime-media.ts
      - name: Summarize bounded proof
        run: cat .local/runtime/latest-media-proof.json >> "$GITHUB_STEP_SUMMARY"
      - name: Stop only owned runtimes
        if: always()
        run: bash infra/runtime/stop.sh
